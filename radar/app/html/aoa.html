<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/media-stream-player.min.js"></script>
	<script src="js/toast.js"></script>
	<style>
		#video-view {
			width: 100%;
			max-width: 960px;
			aspect-ratio: 16 / 9;
			background: #000;
			position: relative;
			overflow: hidden;
		}
		#video {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="card mb-4">
			<div class="card-header">
				<h5 class="card-title mb-0">Live Stream</h5>
			</div>
			<div class="card-body">
				<div class="row g-3 align-items-end mb-3">
					<div class="col-12 col-md-4">
						<label for="detectionSensitivity" class="form-label">Detection Sensitivity</label>
						<select id="detectionSensitivity" class="form-select">
							<option value="">Loading...</option>
							<option value="low">Low</option>
							<option value="medium">Medium</option>
							<option value="high">High</option>
						</select>
					</div>
					<div class="col-12 col-md-3">
						<button id="saveSensitivity" class="btn btn-primary">Save</button>
					</div>
				</div>
				<div id="video-view">
					<div id="video"></div>
				</div>
			</div>
		</div>
	</div>

<script>
$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			playVideo(app.device && app.device.aspect ? app.device.aspect : '16:9');
			loadDetectionSensitivity();
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});

	$('#saveSensitivity').on('click', saveDetectionSensitivity);
	$('#radar-ota-json-from-form').on('click', loadRadarOtaJsonFromForm);
	$('#radar-ota-build-set').on('click', buildRadarOtaSetFromJson);
	$('#radar-ota-build-get').on('click', function() { setRadarOtaHexOutput(radarOtaBytesToHex([0x01])); });
	$('#radar-ota-build-caps').on('click', function() { setRadarOtaHexOutput(radarOtaBytesToHex([0x03])); });
	$('#radar-ota-decode').on('click', decodeRadarOtaHexInput);
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function playVideo(aspect) {
	let videoWidth = 1280;
	let videoHeight = 720;
	let ratio = '16 / 9';

	switch (aspect) {
		case '4:3':
			videoWidth = 800;
			videoHeight = 600;
			ratio = '4 / 3';
			break;
		case '1:1':
			videoWidth = 640;
			videoHeight = 640;
			ratio = '1 / 1';
			break;
		case '16:10':
			videoWidth = 800;
			videoHeight = 500;
			ratio = '16 / 10';
			break;
		default:
			break;
	}

	$('#video-view').css('aspect-ratio', ratio);
	const secureConnection = location.protocol === 'https:' ? ' secure=true' : '';
	const player = '<media-stream-player hostname="' + window.location.hostname + '"' + secureConnection +
		' format="RTP_H264" compression="40" audio="0"' +
		' resolution="' + videoWidth + 'x' + videoHeight + '"' +
		' variant="basic" autoplay></media-stream-player>';
	$('#video').empty().append(player);
}

function normalizeDetectionSensitivity(value) {
	value = String(value || '').toLowerCase();
	if (value === 'low' || value === 'medium' || value === 'high') return value;
	return '';
}

function loadDetectionSensitivity() {
	$('#detectionSensitivity').val('').prop('disabled', true);
	$('#saveSensitivity').prop('disabled', true);
	$.ajax({ type: 'POST', url: '/axis-cgi/radar/radaranalytics.cgi', data: JSON.stringify({ apiVersion: '2.4', method: 'getDetectionSensitivity' }), contentType: 'application/json', dataType: 'json', cache: false,
		success: function(data) {
			const apiData = data.data || {};
			const value = normalizeDetectionSensitivity(apiData.value);
			if (value) {
				$('#detectionSensitivity').val(value);
			} else {
				$('#detectionSensitivity').val('');
				showToast('Radar returned an unknown Detection Sensitivity value', 'warning');
			}
		},
		error: function(xhr) {
			$('#detectionSensitivity').val('');
			showToast('Failed to read Detection Sensitivity: ' + xhr.responseText, 'danger');
		},
		complete: function() {
			$('#detectionSensitivity').prop('disabled', false);
			$('#saveSensitivity').prop('disabled', false);
		}
	});
}

function saveDetectionSensitivity() {
	const button = $('#saveSensitivity');
	const value = normalizeDetectionSensitivity($('#detectionSensitivity').val());
	if (!value) {
		showToast('Select Detection Sensitivity before saving', 'warning');
		return;
	}
	button.prop('disabled', true).text('Saving...');
	$.ajax({ type: 'POST', url: '/axis-cgi/radar/radaranalytics.cgi', data: JSON.stringify({ apiVersion: '2.4', method: 'setDetectionSensitivity', params: { value } }), contentType: 'application/json', dataType: 'json',
		success: function(data) {
			showToast('Detection Sensitivity saved', 'success');
			loadDetectionSensitivity();
		},
		error: function(xhr) { showToast('Failed to save Detection Sensitivity: ' + xhr.responseText, 'danger'); button.prop('disabled', false); },
		complete: function() { button.text('Save'); }
	});
}

const AI_B100_RADAR_OTA_PORT = 130;
const RADAR_OTA_FIELD_DETECTION_SENSITIVITY = 0x0001;

function radarOtaByte(value) { return value & 0xff; }
function radarOtaClamp(value, minValue, maxValue) {
	const n = Number(value);
	if (!Number.isFinite(n)) return minValue;
	if (n < minValue) return minValue;
	if (n > maxValue) return maxValue;
	return Math.round(n);
}
function radarOtaBytesToHex(bytes) {
	return (bytes || []).map(function(value) { return ('0' + radarOtaByte(value).toString(16)).slice(-2); }).join('').toUpperCase();
}
function radarOtaHexToBytes(hex) {
	const clean = String(hex || '').replace(/\s+/g, '').toUpperCase();
	if (!clean.length) return [];
	if (clean.length % 2 !== 0 || !/^[0-9A-F]+$/.test(clean)) throw new Error('HEX must be even-length hexadecimal string');
	const bytes = [];
	for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.substr(i, 2), 16));
	return bytes;
}
function radarOtaWriteU16BE(out, value) {
	const v = radarOtaClamp(value, 0, 65535);
	out.push((v >> 8) & 0xff);
	out.push(v & 0xff);
}
function radarOtaReadU16BE(bytes, index) {
	return (radarOtaByte(bytes[index]) << 8) | radarOtaByte(bytes[index + 1]);
}
function radarOtaCrc8(bytes) {
	let crc = 0;
	for (let i = 0; i < bytes.length; i++) {
		crc ^= radarOtaByte(bytes[i]);
		for (let bit = 0; bit < 8; bit++) {
			if (crc & 0x80) crc = ((crc << 1) ^ 0x07) & 0xff;
			else crc = (crc << 1) & 0xff;
		}
	}
	return crc & 0xff;
}
function radarSensitivityCode(value) {
	const v = String(value || '').trim().toLowerCase();
	if (v === 'low') return 1;
	if (v === 'medium') return 2;
	if (v === 'high') return 3;
	throw new Error('detectionSensitivity must be low, medium, or high');
}
function radarSensitivityName(code) {
	if (code === 1) return 'low';
	if (code === 2) return 'medium';
	if (code === 3) return 'high';
	return 'unknown';
}
function radarOtaBuildConfigBody(config) {
	const cfg = config || {};
	const body = [];
	body.push(radarOtaClamp(cfg.protocolVersion || 1, 1, 255));
	radarOtaWriteU16BE(body, RADAR_OTA_FIELD_DETECTION_SENSITIVITY);
	body.push(radarSensitivityCode(cfg.detectionSensitivity));
	body.push(0, 0, 0);
	body.push(radarOtaCrc8(body));
	return body;
}
function radarOtaParseConfigBody(body) {
	if (!body || body.length !== 8) throw new Error('Radar OTA config body must be 8 bytes');
	if (radarOtaCrc8(body.slice(0, 7)) !== radarOtaByte(body[7])) throw new Error('Config CRC mismatch');
	const fieldMask = radarOtaReadU16BE(body, 1);
	const sensitivityCode = radarOtaByte(body[3]);
	return {
		protocolVersion: radarOtaByte(body[0]),
		fieldMask,
		detectionSensitivity: radarSensitivityName(sensitivityCode),
		fields: { detectionSensitivity: radarSensitivityName(sensitivityCode) },
		reserved: [radarOtaByte(body[4]), radarOtaByte(body[5]), radarOtaByte(body[6])],
		crc8: radarOtaByte(body[7])
	};
}
function Encode(config, command) {
	const cmd = radarOtaByte(command);
	if (cmd === 0x01 || cmd === 0x03) return radarOtaBytesToHex([cmd]);
	if (cmd !== 0x02) throw new Error('Unsupported command for JSON encode');
	return radarOtaBytesToHex([0x02].concat(radarOtaBuildConfigBody(config || {})));
}
function Decode(input) {
	const bytes = radarOtaHexToBytes(input);
	if (!bytes.length) throw new Error('Empty payload');
	const command = radarOtaByte(bytes[0]);
	if (command === 0x01 || command === 0x03) return { port: AI_B100_RADAR_OTA_PORT, command, type: command === 0x01 ? 'get_config_request' : 'get_caps_request' };
	if (command === 0x02 || command === 0x81) {
		if (bytes.length !== 9) throw new Error('Config request/response must be 9 bytes');
		return { port: AI_B100_RADAR_OTA_PORT, command, type: command === 0x02 ? 'set_config_request' : 'get_config_response', config: radarOtaParseConfigBody(bytes.slice(1)) };
	}
	if (command === 0x82) {
		if (bytes.length !== 5) throw new Error('ACK/NACK must be 5 bytes');
		if (radarOtaCrc8(bytes.slice(0, 4)) !== radarOtaByte(bytes[4])) throw new Error('ACK/NACK CRC mismatch');
		return { port: AI_B100_RADAR_OTA_PORT, command, type: 'set_config_ack', version: radarOtaByte(bytes[1]), ackFor: radarOtaByte(bytes[2]), status: radarOtaByte(bytes[3]), success: radarOtaByte(bytes[3]) === 0 };
	}
	if (command === 0x83) {
		if (bytes.length !== 8) throw new Error('Capabilities response must be 8 bytes');
		const payload = bytes.slice(1);
		if (radarOtaCrc8(payload.slice(0, 6)) !== radarOtaByte(payload[6])) throw new Error('Capabilities CRC mismatch');
		return { port: AI_B100_RADAR_OTA_PORT, command, type: 'get_caps_response', protocolVersion: radarOtaByte(payload[0]), fields: [{ id: radarOtaReadU16BE(payload, 1), name: 'detectionSensitivity', values: ['low', 'medium', 'high'] }], detectionSensitivity: { minCode: radarOtaByte(payload[3]), maxCode: radarOtaByte(payload[4]), values: ['low', 'medium', 'high'] } };
	}
	throw new Error('Unsupported command byte: 0x' + command.toString(16).toUpperCase());
}
function readRadarOtaConfig() {
	return { protocolVersion: 1, detectionSensitivity: normalizeDetectionSensitivity($('#detectionSensitivity').val()) || 'medium' };
}
function loadRadarOtaJsonFromForm(notify) {
	$('#radar-ota-json-input').val(JSON.stringify(readRadarOtaConfig(), null, 2));
	if (notify !== false) showToast('Radar OTA JSON loaded from form', 'info');
}
function setRadarOtaHexOutput(hex) {
	$('#radar-ota-hex-output').val(hex);
	$('#radar-ota-hex-input').val(hex);
}
function buildRadarOtaSetFromJson() {
	try {
		setRadarOtaHexOutput(Encode(JSON.parse($('#radar-ota-json-input').val()), 0x02));
		showToast('Radar OTA Set Config built for port 130', 'success');
	} catch (error) { showToast('Failed to build Radar OTA payload: ' + error.message, 'danger'); }
}
function decodeRadarOtaHexInput() {
	try {
		$('#radar-ota-json-output').val(JSON.stringify(Decode($('#radar-ota-hex-input').val()), null, 2));
	} catch (error) { showToast('Failed to decode Radar OTA payload: ' + error.message, 'danger'); }
}
function downloadRadarOtaTranslator() {
	window.location.href = 'radar_ota_translator';
}

function pollLoraStatus() {
	$.ajax({ type: 'GET', url: 'status', dataType: 'json', cache: false,
		success: function(d) {
			const dot = $('#lora-nav-dot');
			const lw = d && d.lorawan;
			dot.removeClass('lora-joined lora-connected lora-disconnected');
			if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
			else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
			else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
		}
	});
}
</script>
</body>
</html>
