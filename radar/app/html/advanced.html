<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/pages.js"></script>
<script src="js/chrome.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/toast.js"></script>
</head>
<body>
<header class="app-header">
<div class="app-name" id="app-name">&nbsp;</div>
<nav class="nav-bar" id="nav-bar"></nav>
</header>

<div class="page-content">
<h4 class="mb-3">Advanced Settings</h4>

<div class="card mb-3">
<div class="card-header"><h5 class="card-title mb-0">Radar Maintenance</h5></div>
<div class="card-body">
<div class="row g-3 mb-3">
<div class="col-md-3"><div class="text-muted">Status</div><strong id="radarConnected">--</strong></div>
<div class="col-md-3"><div class="text-muted">Publish Value</div><strong id="radarOccupancy">0</strong></div>
<div class="col-md-3"><div class="text-muted">Tracked Objects</div><strong id="trackedObjects">0</strong></div>
<div class="col-md-3"><div class="text-muted">Last Frame</div><strong id="lastFrame">--</strong></div>
</div>
<button id="resetRadar" class="btn btn-outline-danger">Reset Radar State</button>
<button id="publishNow" class="btn btn-success ms-2">Publish Now</button>
</div>
</div>
</div>

<script>
$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			loadRadar();
			setInterval(loadRadar, 2000);
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});

	$('#resetRadar').on('click', resetRadar);
	$('#publishNow').on('click', publishNow);
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function loadRadar() {
	$.ajax({ type: 'GET', url: 'radar', dataType: 'json', cache: false,
		success: function(data) {
			const occ = data.peakOccupancy || data.occupancy || {};
			$('#radarConnected').text(data.connected ? 'Connected' : 'Disconnected');
			$('#radarOccupancy').text(occ.total || 0);
			$('#trackedObjects').text(data.trackedObjects || 0);
			$('#lastFrame').text(data.lastFrameAgeSeconds >= 0 ? data.lastFrameAgeSeconds + ' s ago' : '--');
		}
	});
}

function resetRadar() {
	$.ajax({ type: 'POST', url: 'radar_reset', success: function() { showToast('Radar state reset', 'success'); loadRadar(); },
		error: function(xhr) { showToast('Reset failed: ' + xhr.responseText, 'danger'); }
	});
}

function publishNow() {
	$.ajax({ type: 'POST', url: 'publish', success: function() { showToast('Radar occupancy published', 'success'); loadRadar(); },
		error: function(xhr) { showToast('Publish failed: ' + xhr.responseText, 'danger'); }
	});
}

function pollLoraStatus() {
	$.ajax({ type: 'GET', url: 'status', dataType: 'json', cache: false,
		success: function(d) {
			const dot = $('#lora-nav-dot');
			const lw = d && d.lorawan;
			dot.removeClass('lora-joined lora-connected lora-disconnected');
			if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
			else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
			else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
		}
	});
}
</script>
</body>
</html>
