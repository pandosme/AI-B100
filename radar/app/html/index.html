<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/toast.js"></script>
	<style>
		.publish-log-table code { white-space: normal; word-break: break-all; user-select: text; }
		.payload-cell { display: flex; align-items: center; gap: 0.5rem; }
		.payload-cell code { flex: 1; min-width: 0; }
		.payload-copy { flex: 0 0 auto; }
		.use-case-title { align-items: center; color: #1a2a6c; display: inline-flex; gap: 0.4rem; text-decoration: none; }
		.use-case-title:hover, .use-case-title:focus-visible { color: #2d4a9e; text-decoration: underline; }
		.use-case-title .use-case-arrow { font-size: 1.35rem; line-height: 1; }
		.page-content .form-group { align-items: stretch; flex-direction: column; }
		.page-content .form-group label { min-width: 0; margin: 0 0 0.5rem 0; }
		.page-content .form-control { width: 100%; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="row mb-4">
			<div class="col-12 col-xl-4 mb-3 d-flex">
				<div class="card publish-card w-100">
						<div class="card-header"><h5 class="card-title mb-0"><a class="use-case-title" href="counting.html">Counting <span class="use-case-arrow" aria-hidden="true">&rsaquo;</span></a></h5></div>
					<div class="card-body">
						<div class="form-group mb-3">
							<label for="countingInterval">Publish Interval: <strong id="countingIntervalValue">15</strong> m</label>
							<input type="range" class="form-range" id="countingInterval" min="1" max="60" value="15">
						</div>
						<div class="form-check form-switch mb-3">
							<input class="form-check-input" type="checkbox" role="switch" id="countingEnabled">
							<label class="form-check-label" for="countingEnabled">Enable Publishing</label>
						</div>
						<div class="form-group mb-3"><label class="form-label">Fixed Uplink Port</label><div class="form-control bg-light">1</div></div>
						<div class="form-group mb-3"><label>Next Publish</label><div id="countingNext" class="text-muted">--</div></div>
						<div class="mt-3 d-flex flex-wrap gap-2">
							<button class="btn btn-primary save-publish-settings">Save Settings</button>
							<button class="btn btn-success" id="publishCountingNow">Publish Now</button>
						</div>
							<div class="text-muted mt-2">Cumulative named line totals on fixed uplink port 1.</div>
					</div>
				</div>
			</div>

			<div class="col-12 col-xl-4 mb-3 d-flex">
				<div class="card publish-card w-100">
					<div class="card-header"><h5 class="card-title mb-0"><a class="use-case-title" href="occupancy.html">Occupancy <span class="use-case-arrow" aria-hidden="true">&rsaquo;</span></a></h5></div>
					<div class="card-body">
						<div class="form-group mb-3">
							<label for="occupancyInterval">Publish Interval: <strong id="occupancyIntervalValue">15</strong> m</label>
							<input type="range" class="form-range" id="occupancyInterval" min="1" max="60" value="15">
						</div>
						<div class="form-check form-switch mb-3">
							<input class="form-check-input" type="checkbox" role="switch" id="occupancyEnabled">
							<label class="form-check-label" for="occupancyEnabled">Enable Publishing</label>
						</div>
						<div class="form-group mb-3"><label class="form-label">Fixed Uplink Port</label><div class="form-control bg-light">2</div></div>
						<div class="form-group mb-3"><label>Next Publish</label><div id="occupancyNext" class="text-muted">--</div></div>
						<div class="mt-3 d-flex flex-wrap gap-2">
							<button class="btn btn-primary save-publish-settings">Save Settings</button>
							<button class="btn btn-success" id="publishOccupancyNow">Publish Now</button>
						</div>
						<div class="text-muted mt-2">Occupancy uses fixed uplink port 2.</div>
					</div>
				</div>
			</div>

			<div class="col-12 col-xl-4 mb-3 d-flex">
				<div class="card publish-card w-100">
					<div class="card-header"><h5 class="card-title mb-0"><a class="use-case-title" href="alert.html">Presence Alert <span class="use-case-arrow" aria-hidden="true">&rsaquo;</span></a></h5></div>
					<div class="card-body">
						<div class="form-group mb-3">
							<label for="activeIntervalSeconds">Active Publish Interval: <strong id="activeIntervalValue">60</strong> s</label>
							<input type="range" class="form-range" id="activeIntervalSeconds" min="60" max="300" value="60">
						</div>
						<div class="form-group mb-3">
							<label for="heartbeatMinutes">Inactive Heartbeat Interval: <strong id="heartbeatValue">15</strong> m</label>
							<input type="range" class="form-range" id="heartbeatMinutes" min="5" max="60" value="15">
						</div>
						<div class="form-check form-switch mb-3">
							<input class="form-check-input" type="checkbox" role="switch" id="alertEnabled">
							<label class="form-check-label" for="alertEnabled">Enable Publishing</label>
						</div>
						<div class="form-group mb-3"><label class="form-label">Fixed Uplink Port</label><div class="form-control bg-light">3</div></div>
						<div class="form-group mb-3"><label>Next Publish</label><div id="alertNext" class="text-muted">--</div></div>
						<div class="mt-3 d-flex flex-wrap gap-2">
							<button class="btn btn-primary save-publish-settings">Save Settings</button>
							<button class="btn btn-success" id="publishAlertNow">Publish Now</button>
						</div>
						<div class="text-muted mt-2">Presence Alert uses fixed uplink port 3.</div>
					</div>
				</div>
			</div>
		</div>

		<div class="row mb-4">
			<div class="col-12">
				<div class="card w-100">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="card-title mb-0">Last 20 LoRaWAN Publishes</h5>
						<button id="downloadTranslator" class="btn btn-secondary btn-sm">Download JavaScript Translator</button>
					</div>
					<div class="card-body">
						<div class="table-responsive">
							<table class="table table-sm table-striped align-middle publish-log-table mb-0">
								<thead><tr><th>Date</th><th>Time</th><th>Use Case</th><th>Port</th><th>Payload</th></tr></thead>
								<tbody id="publishLogBody"><tr><td colspan="5" class="text-muted text-center">No publish data yet.</td></tr></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

<script>
let currentSettings = {};
let lastPublishLogKey = '';

$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			loadSettings();
			updateTimer();
			setInterval(updateTimer, 1000);
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});

	$('#publishCountingNow').on('click', function() { publishNow('counting', this); });
	$('#publishOccupancyNow').on('click', function() { publishNow('occupancy', this); });
	$('#publishAlertNow').on('click', function() { publishNow('alert', this); });
	$('#countingInterval').on('input', function() { $('#countingIntervalValue').text($(this).val()); });
	$('#occupancyInterval').on('input', function() { $('#occupancyIntervalValue').text($(this).val()); });
	$('#activeIntervalSeconds').on('input', function() { $('#activeIntervalValue').text($(this).val()); });
	$('#heartbeatMinutes').on('input', function() { $('#heartbeatValue').text($(this).val()); });
	$('.save-publish-settings').on('click', savePublishSettings);
	$('#publishLogBody').on('click', '.payload-copy', function() { copyPayload($(this).data('payload')); });
	$('#downloadTranslator').on('click', function() { window.location.href = 'translator'; });
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function loadSettings() {
	$.ajax({ type: 'GET', url: 'settings', dataType: 'json', cache: false,
		success: function(settings) {
			currentSettings = settings || {};
			const transmission = currentSettings.transmission || {};
			const counting = transmission.counting || {};
			const occupancy = transmission.occupancy || {};
			const presence = transmission.presence || transmission.alert || {};
			$('#countingEnabled').prop('checked', !!counting.enabled);
			$('#occupancyEnabled').prop('checked', !!occupancy.enabled);
			$('#alertEnabled').prop('checked', !!presence.enabled);
			$('#countingInterval').val(counting.intervalMinutes || 15); $('#countingIntervalValue').text(counting.intervalMinutes || 15);
			$('#occupancyInterval').val(occupancy.intervalMinutes || 15); $('#occupancyIntervalValue').text(occupancy.intervalMinutes || 15);
			$('#activeIntervalSeconds').val(Math.max(60, presence.activeIntervalSeconds || 60)); $('#activeIntervalValue').text(Math.max(60, presence.activeIntervalSeconds || 60));
			$('#heartbeatMinutes').val(presence.heartbeatMinutes || 15); $('#heartbeatValue').text(presence.heartbeatMinutes || 15);
		}
	});
}

function savePublishSettings() {
	const transmission = currentSettings.transmission || {};
	transmission.counting = Object.assign({ port: 1, scenes: [] }, transmission.counting || {}, {
		enabled: $('#countingEnabled').is(':checked'), intervalMinutes: parseInt($('#countingInterval').val(), 10)
	});
	transmission.occupancy = Object.assign({ port: 2, type: 'maximum' }, transmission.occupancy || {}, {
		enabled: $('#occupancyEnabled').is(':checked'), intervalMinutes: parseInt($('#occupancyInterval').val(), 10)
	});
	transmission.presence = Object.assign({ port: 3, transitionSeconds: 2, label: 'human', schedule: { enabled: false, start: '18:00', end: '06:00' } }, transmission.presence || transmission.alert || {}, {
		enabled: $('#alertEnabled').is(':checked'),
		activeIntervalSeconds: parseInt($('#activeIntervalSeconds').val(), 10),
		heartbeatMinutes: parseInt($('#heartbeatMinutes').val(), 10)
	});
	delete transmission.alert;
	$.ajax({ type: 'POST', url: 'settings', data: JSON.stringify({ transmission }), contentType: 'application/json',
		success: function() { currentSettings.transmission = transmission; showToast('Publish settings saved', 'success'); updateTimer(); },
		error: function(xhr, status, error) { showToast('Failed to save publish settings: ' + error, 'danger'); }
	});
}

function publishNow(stream, button) {
	const originalText = $(button).text();
	$(button).prop('disabled', true).text('Publishing...');
	$.ajax({ type: 'POST', url: 'publish?stream=' + encodeURIComponent(stream),
		success: function() { showToast('Publish accepted', 'success'); updateTimer(); },
		error: function(xhr) { showToast('Publish failed: ' + xhr.responseText, 'danger'); },
		complete: function() { $(button).prop('disabled', false).text(originalText); }
	});
}

function updateTimer() {
	$.ajax({ type: 'GET', url: 'counters', dataType: 'json', cache: false,
		success: function(data) {
			const publish = data.publish || {};
			updateStreamCard('counting', publish.counting || {});
			updateStreamCard('occupancy', publish.occupancy || {});
			updateStreamCard('alert', publish.alert || {});
			renderPublishLog(data.publishLog || []);
		}
	});
}

function updateStreamCard(stream, publish) {
	$('#' + stream + 'Next').text(formatTimer(publish));
}

function formatTimer(publish) {
	if (!publish || publish.enabled === false) return 'Disabled';
	const seconds = publish.secondsUntilPublish || 0;
	if (seconds <= 0) return 'Due now';
	const minutes = Math.floor(seconds / 60);
	const rem = seconds % 60;
	return minutes + 'm ' + rem + 's';
}

function renderPublishLog(entries) {
	const key = JSON.stringify(entries || []);
	if (key === lastPublishLogKey) return;
	lastPublishLogKey = key;
	const body = $('#publishLogBody');
	body.empty();
	if (!entries || entries.length === 0) {
		body.html('<tr><td colspan="5" class="text-muted text-center">No publish data yet.</td></tr>');
		return;
	}
	entries.slice().reverse().slice(0, 20).forEach(function(entry) {
		const parts = splitDateTime(entry.time || '');
		const payload = entry.payload || '';
		body.append('<tr><td>' + escapeHtml(parts.date) + '</td><td>' + escapeHtml(parts.time) + '</td><td>' + escapeHtml(entry.stream || '') + '</td><td>' + escapeHtml(entry.port) + '</td><td><div class="payload-cell"><code>' + escapeHtml(payload) + '</code><button type="button" class="btn btn-outline-secondary btn-sm payload-copy" data-payload="' + escapeHtml(payload) + '" title="Copy payload">Copy</button></div></td></tr>');
	});
}

function copyPayload(payload) {
	payload = String(payload || '');
	if (navigator.clipboard && window.isSecureContext) {
		navigator.clipboard.writeText(payload).then(function() { showToast('Payload copied', 'success'); }, fallbackCopyPayload.bind(null, payload));
	} else {
		fallbackCopyPayload(payload);
	}
}

function fallbackCopyPayload(payload) {
	const input = $('<textarea readonly></textarea>').val(payload).css({ position: 'fixed', top: '-1000px', left: '-1000px' }).appendTo('body');
	input[0].select();
	try {
		document.execCommand('copy');
		showToast('Payload copied', 'success');
	} catch (error) {
		showToast('Copy failed', 'danger');
	}
	input.remove();
}

function splitDateTime(value) {
	const parts = String(value).split(/\s+/);
	if (parts.length >= 2) return { date: parts[0], time: parts.slice(1).join(' ') };
	return { date: '', time: value };
}

function escapeHtml(value) { return $('<div>').text(value == null ? '' : String(value)).html(); }

function pollLoraStatus() {
	$.ajax({ type: 'GET', url: 'status', dataType: 'json', cache: false,
		success: function(d) {
			const dot = $('#lora-nav-dot');
			const lw = d && d.lorawan;
			dot.removeClass('lora-joined lora-connected lora-disconnected');
			if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
			else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
			else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
		}
	});
}
</script>
</body>
</html>
