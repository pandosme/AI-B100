<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/toast.js"></script>
	<style>
		.log-table-wrap {
			max-height: 520px;
			overflow-y: auto;
			font-size: 0.83rem;
		}
		.log-table td, .log-table th {
			vertical-align: middle;
			white-space: nowrap;
		}
		.log-table td.payload-cell {
			font-family: 'Courier New', monospace;
			max-width: 280px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		.sig-good    { color: #198754; font-weight: 600; }
		.sig-ok      { color: #0d6efd; }
		.sig-warn    { color: #fd7e14; }
		.sig-bad     { color: #dc3545; }
		#no-messages { font-size: 0.9rem; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="row">
			<!-- Downlink Log Card -->
			<div class="col-12 col-lg-8">
				<div class="card mb-3">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="card-title mb-0">Downlink Message Log</h5>
						<span class="text-muted me-auto ms-3" style="font-size:0.82rem">Total: <span id="message-count">0</span></span>
						<button id="clear-log" class="btn btn-sm btn-outline-danger">Clear</button>
					</div>
					<div class="card-body p-0">
						<div class="log-table-wrap">
							<table class="table table-sm table-hover log-table mb-0">
								<thead class="table-light sticky-top">
									<tr>
										<th>Time</th>
										<th>Port</th>
										<th>Len</th>
										<th>Payload (hex)</th>
										<th>ASCII</th>
										<th>RSSI</th>
										<th>SNR</th>
										<th>fcntDown</th>
									</tr>
								</thead>
								<tbody id="downlink-tbody">
								</tbody>
							</table>
							<div id="no-messages" class="text-center text-muted p-4">
								No downlink messages received yet.
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Downlink Command Table Card -->
			<div class="col-12 col-lg-4">
				<div class="card mb-3">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="card-title mb-0">Downlink Commands</h5>
						<button id="save-commands" class="btn btn-sm btn-primary">Save</button>
					</div>
					<div class="card-body p-0">
						<table class="table table-sm table-hover mb-0" style="font-size:0.82rem;">
							<thead class="table-light">
								<tr>
									<th style="width:36px">On</th>
									<th style="width:46px">Byte</th>
									<th>Name</th>
									<th>Action</th>
								</tr>
							</thead>
							<tbody id="command-table-body">
							</tbody>
						</table>
					</div>
				</div>
		</div>
	</div>

<script>
// Downlink command definitions — enabled states loaded from settings on init
const DEFAULT_COMMANDS = [
	// Port 100 — Actions
	{ enabled: true,  port: 100, byte: '0x01', message: 'Restart Bridge',       action: 'Restart the AI-B100 LoRaWAN bridge device' },
	{ enabled: true,  port: 100, byte: '0x02', message: 'Join Network',          action: 'Initiate a new LoRaWAN OTAA join' },
	{ enabled: true,  port: 100, byte: '0x03', message: 'Reset Radar State',     action: 'Clear retained radar occupancy objects and publish immediately' },
	// Port 110 — Configuration (2-byte: byte[0]=command, byte[1]=value)
	{ enabled: true,  port: 110, byte: '0x01', message: 'Set Interval',          action: 'Set transmission interval; byte 1 = minutes (5-60)' },
	{ enabled: true,  port: 110, byte: '0x02', message: 'Set Data Rate',         action: 'Set fixed data rate; byte 1 = 0-5 (DR0-DR5)' },
	{ enabled: true,  port: 110, byte: '0x03', message: 'Set ADR',               action: 'Enable/disable ADR; byte 1 = 1 (on) / 0 (off)' },
	// Port 120 — Information requests
	{ enabled: true,  port: 120, byte: '0x01', message: 'Camera Info',   action: 'Reply on port 121: model, serial, firmware, uptime hours, CPU %, ACAP version' },
	{ enabled: true,  port: 120, byte: '0x02', message: 'Bridge Info',   action: 'Reply on port 122: hardware, firmware, power source, temperature, restart count, DevAddr' },
	{ enabled: true,  port: 120, byte: '0x03', message: 'Signal Quality',action: 'Update local signal quality status' },
	// Port 130 — Radar OTA configuration
	{ enabled: true,  port: 130, byte: '0x01', message: 'Radar OTA Get Config', action: 'Request Radar OTA config response on port 130' },
	{ enabled: true,  port: 130, byte: '0x02', message: 'Radar OTA Set Config', action: 'Apply Radar OTA config payload and return ACK/NACK on port 130' },
	{ enabled: true,  port: 130, byte: '0x03', message: 'Radar OTA Get Caps',   action: 'Request Radar OTA capability response on port 130' },
	// Port 132 — Occupancy OTA configuration
	{ enabled: true,  port: 132, byte: '0x01', message: 'Occupancy OTA Get Config', action: 'Request Occupancy OTA config response on port 132' },
	{ enabled: true,  port: 132, byte: '0x02', message: 'Occupancy OTA Set Config', action: 'Apply Occupancy OTA config payload and return ACK/NACK on port 132' },
	{ enabled: true,  port: 132, byte: '0x03', message: 'Occupancy OTA Get Caps',   action: 'Request Occupancy OTA capability response on port 132' },
	// Port 133 — Detection Alert OTA configuration
	{ enabled: true,  port: 133, byte: '0x01', message: 'Alert OTA Get Config', action: 'Request Detection Alert OTA config response on port 133' },
	{ enabled: true,  port: 133, byte: '0x02', message: 'Alert OTA Set Config', action: 'Apply Detection Alert OTA config payload and return ACK/NACK on port 133' },
	{ enabled: true,  port: 133, byte: '0x03', message: 'Alert OTA Get Caps',   action: 'Request Detection Alert OTA capability response on port 133' }
];

$(document).ready(function() {
	let lastRenderedFcnt = -1;
	let clearedAtFcnt = -2;
	let commands = JSON.parse(JSON.stringify(DEFAULT_COMMANDS));

	// Load app info and merge saved enabled states from settings
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(data) {
			document.title = data.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(data.manifest.acapPackageConf.setup.friendlyName);
		}
	});

	$.ajax({ type: 'GET', url: 'settings', dataType: 'json', cache: false,
		success: function(s) {
			if (s.downlinkCommands && Array.isArray(s.downlinkCommands)) {
				s.downlinkCommands.forEach(function(saved) {
					const byteVal = '0x' + ('0' + saved.byte.toString(16).toUpperCase()).slice(-2);
					const match = commands.find(c => c.port === saved.port && c.byte === byteVal);
					if (match) match.enabled = saved.enabled;
				});
			}
			renderCommandTable();
		},
		error: function() { renderCommandTable(); }
	});
	const RSSI_LEVELS = [
		{ min: -70,  label: 'Excellent', cls: 'sig-good' },
		{ min: -85,  label: 'Good',      cls: 'sig-ok'   },
		{ min: -100, label: 'Sufficient',cls: 'sig-warn'  },
		{ min: -115, label: 'Poor',      cls: 'sig-warn'  },
		{ min: -999, label: 'Bad',       cls: 'sig-bad'   }
	];
	const SNR_LEVELS = [
		{ min: 10,  label: 'Excellent', cls: 'sig-good' },
		{ min: 5,   label: 'Good',      cls: 'sig-ok'   },
		{ min: 0,   label: 'Sufficient',cls: 'sig-warn'  },
		{ min: -5,  label: 'Poor',      cls: 'sig-warn'  },
		{ min: -99, label: 'Bad',       cls: 'sig-bad'   }
	];
	function sigHtml(value, levels) {
		const lvl = levels.find(l => value >= l.min) || levels[levels.length - 1];
		return `<span class="${lvl.cls}">${value}</span><br><small class="text-muted">${lvl.label}</small>`;
	}

	// Hex string (even chars, no spaces) → "01 02 03 04" uppercase
	function formatHex(str) {
		if (!str || str.length === 0) return '—';
		// Already spaced or not?
		const clean = str.replace(/\s/g, '');
		if (/^[0-9A-Fa-f]+$/.test(clean) && clean.length % 2 === 0)
			return clean.match(/.{1,2}/g).join(' ').toUpperCase();
		return str; // pass through non-hex as-is
	}

	// Try to render an ASCII view from a HEX payload string
	function hexToAsciiSafe(hexStr) {
		const clean = hexStr.replace(/\s/g, '');
		if (!/^[0-9A-Fa-f]+$/.test(clean) || clean.length % 2 !== 0) return '';
		let out = '';
		for (let i = 0; i < clean.length; i += 2) {
			const code = parseInt(clean.substr(i, 2), 16);
			out += (code >= 32 && code < 127) ? String.fromCharCode(code) : '.';
		}
		return out;
	}

	const PORT_GROUPS = {
		100: 'Port 100 - Actions',
		110: 'Port 110 - Configuration',
		120: 'Port 120 - Information Requests'
		,130: 'Port 130 - Radar OTA'
		,132: 'Port 132 - Occupancy OTA'
		,133: 'Port 133 - Detection Alert OTA'
	};

	function renderCommandTable() {
		const tbody = $('#command-table-body');
		tbody.empty();
		let lastPort = null;
		commands.forEach(function(cmd, idx) {
			if (cmd.port !== lastPort) {
				lastPort = cmd.port;
				const label = PORT_GROUPS[cmd.port] || ('Port ' + cmd.port);
				tbody.append(`<tr class="table-secondary"><td colspan="4"><strong>${label}</strong></td></tr>`);
			}
			tbody.append(`
				<tr>
					<td class="text-center">
						<input type="checkbox" class="form-check-input cmd-enable" data-idx="${idx}" ${cmd.enabled ? 'checked' : ''}>
					</td>
					<td><span class="badge bg-secondary">${cmd.byte}</span></td>
					<td><strong>${cmd.message}</strong></td>
					<td><small>${cmd.action}</small></td>
				</tr>
			`);
		});

		$('.cmd-enable').on('change', function() {
			const idx = parseInt($(this).data('idx'));
			commands[idx].enabled = $(this).is(':checked');
		});
	}

	renderCommandTable();

	$('#save-commands').on('click', function() {
		// Persist to settings (Phase 3 will wire these to actual handlers)
		$.ajax({
			type: 'POST',
			url: 'settings',
			contentType: 'application/json',
			data: JSON.stringify({ downlinkCommands: commands }),
			success: function() { showToast('Command settings saved', 'success'); },
			error: function() { showToast('Failed to save command settings', 'danger'); }
		});
	});

	function pollDownlinks() {
		$.ajax({
			type: "GET",
			url: 'status',
			dataType: 'json',
			cache: false,
			success: function(data) {
				updateNavDot(data);
				const lw = data.lorawan;
				if (!lw) return;
				const entries = lw.downlinks;
				if (!Array.isArray(entries) || entries.length === 0) return;
				const newestFcnt = entries[entries.length - 1].fcntDown;
				if (newestFcnt === lastRenderedFcnt) return;
				lastRenderedFcnt = newestFcnt;
				const display = entries.filter(function(e) { return e.fcntDown > clearedAtFcnt; });
				renderDownlinkTable(display);
			}
		});
	}

	function buildRow(msg) {
		const parts = (msg.time || '').split(' ');
		const timeStr = parts.length === 2
			? parts[1] + '<br><small class="text-muted">' + parts[0] + '</small>'
			: (msg.time || '—');
		const port      = msg.port != null ? msg.port : '—';
		const len       = msg.length != null ? msg.length : '—';
		const ptype     = (msg.payload_type || 'HEX').toUpperCase();
		const rawPayload= msg.payload || '';

		let hexCell, asciiCell;
		if (ptype === 'HEX') {
			hexCell   = `<code>${formatHex(rawPayload)}</code>`;
			asciiCell = `<small class="text-muted">${hexToAsciiSafe(rawPayload)}</small>`;
		} else {
			// ASCII payload — convert chars to hex for the hex column
			let hexStr = '';
			for (let i = 0; i < rawPayload.length; i++)
				hexStr += ('0' + rawPayload.charCodeAt(i).toString(16)).slice(-2);
			hexCell   = `<code>${formatHex(hexStr)}</code>`;
			asciiCell = `<small class="text-muted">${$('<div>').text(rawPayload).html()}</small>`;
		}

		const rssi = msg.rssi != null ? msg.rssi : null;
		const snr  = msg.snr  != null ? msg.snr  : null;
		const rssiCell = rssi !== null ? sigHtml(rssi, RSSI_LEVELS) + ' dBm' : '—';
		const snrCell  = snr  !== null ? sigHtml(snr,  SNR_LEVELS)  + ' dB'  : '—';

		return `<tr>
			<td style="white-space:nowrap">${timeStr}</td>
			<td><span class="badge bg-secondary">${port}</span></td>
			<td>${len}</td>
			<td class="payload-cell">${hexCell}</td>
			<td class="payload-cell">${asciiCell}</td>
			<td>${rssiCell}</td>
			<td>${snrCell}</td>
			<td>${msg.fcntDown != null ? msg.fcntDown : '—'}</td>
		</tr>`;
	}

	function renderDownlinkTable(entries) {
		const tbody = $('#downlink-tbody');
		tbody.empty();
		if (!entries || entries.length === 0) {
			$('#no-messages').show();
			$('#message-count').text('0');
			return;
		}
		$('#no-messages').hide();
		$('#message-count').text(entries.length);
		// entries are oldest-first (ring buffer); display newest-first
		const reversed = entries.slice().reverse();
		reversed.forEach(function(msg) {
			tbody.append(buildRow(msg));
		});
	}

	$('#clear-log').on('click', function() {
		if (confirm('Clear all downlink messages?')) {
			clearedAtFcnt = lastRenderedFcnt;
			$('#downlink-tbody').empty();
			$('#no-messages').show();
			$('#message-count').text('0');
		}
	});

	// Poll every 5 seconds for new downlinks
	setInterval(pollDownlinks, 5000);
	pollDownlinks();

	function updateNavDot(data) {
		const dot = $('#lora-nav-dot');
		const lw = data && data.lorawan;
		dot.removeClass('lora-joined lora-connected lora-disconnected');
		if (lw && lw.joined) {
			dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
		} else if (lw && lw.connected) {
			dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
		} else {
			dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
		}
	}
});
</script>
</body>
</html>
