<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/media-stream-player.min.js"></script>
	<script src="js/polygonselect.js"></script>
	<script src="js/toast.js"></script>
	<style>
		#video-view { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
		#video { position: absolute; inset: 0; width: 100%; height: 100%; }
		#settings-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: auto; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="card mb-4">
			<div class="card-header">
				<h5 class="card-title mb-0">Occupancy</h5>
			</div>
			<div class="card-body">
				<div class="row g-3 align-items-end">
					<div class="col-12 col-md-3">
						<label for="occupancyType" class="form-label">Occupancy Type</label>
						<select id="occupancyType" class="form-select">
							<option value="maximum">Interval Maximum</option>
							<option value="areaBalance">Area balance (AOI only)</option>
						</select>
					</div>
					<div class="col-12 col-md-3">
						<label class="form-label d-block">Detection Label</label>
						<div class="btn-group" role="group" aria-label="Occupancy detection label">
							<input type="radio" class="btn-check" name="occupancyLabel" id="occupancyHuman" value="human" autocomplete="off">
							<label class="btn btn-outline-primary" for="occupancyHuman">Humans</label>
							<input type="radio" class="btn-check" name="occupancyLabel" id="occupancyVehicle" value="vehicle" autocomplete="off">
							<label class="btn btn-outline-primary" for="occupancyVehicle">Vehicles</label>
						</div>
					</div>
				</div>
				<div class="row g-3 mt-2">
					<div class="col-12 col-md-3" id="intervalMaximumWrap"><div>Interval Maximum: <strong id="intervalMaximumValue">0</strong></div></div>
					<div class="col-12 col-md-3 area-balance-value"><div>Entering: <strong id="occupancyEntering">0</strong></div></div>
					<div class="col-12 col-md-3 area-balance-value"><div>Exiting: <strong id="occupancyExiting">0</strong></div></div>
					<div class="col-12">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" id="aoiEnabled">
							<label class="form-check-label" for="aoiEnabled">Area of Interest</label>
						</div>
					</div>
				</div>
				<div class="mt-3">
					<div id="video-view">
						<div id="video"></div>
						<canvas id="settings-canvas" width="1000" height="1000"></canvas>
					</div>
				</div>
				<div class="mt-3">
					<button id="saveOccupancy" class="btn btn-primary">Save</button>
				</div>
			</div>
		</div>
	</div>

<script>
let currentSettings = {};
let polygonSelector = null;

$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			playVideo(app.device && app.device.aspect ? app.device.aspect : '16:9');
			loadSettings();
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});
	$('#occupancyType').on('change', updateModeControls);
	$('#aoiEnabled').on('change', function() {
		if (polygonSelector) polygonSelector.setEnabled($(this).is(':checked'));
		updateModeControls();
	});
	$('#saveOccupancy').on('click', saveOccupancy);
	$('#occupancy-json-from-form').on('click', loadOccupancyTranslatorJsonFromForm);
	$('#occupancy-build-set').on('click', buildOccupancySetFromJson);
	$('#occupancy-build-get').on('click', function() { setOccupancyHexOutput(occupancyOtaBytesToHex([0x01])); });
	$('#occupancy-build-caps').on('click', function() { setOccupancyHexOutput(occupancyOtaBytesToHex([0x03])); });
	$('#occupancy-decode').on('click', decodeOccupancyHexInput);
	setInterval(updateOccupancyStatus, 3000);
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function playVideo(aspect) {
	let videoWidth = 1280;
	let videoHeight = 720;
	let ratio = '16 / 9';
	if (aspect === '4:3') { videoWidth = 800; videoHeight = 600; ratio = '4 / 3'; }
	else if (aspect === '1:1') { videoWidth = 640; videoHeight = 640; ratio = '1 / 1'; }
	else if (aspect === '16:10') { videoWidth = 800; videoHeight = 500; ratio = '16 / 10'; }
	$('#video-view').css('aspect-ratio', ratio);
	initPolygonSelector();
	const secureConnection = location.protocol === 'https:' ? ' secure=true' : '';
	const player = '<media-stream-player hostname="' + window.location.hostname + '"' + secureConnection + ' format="RTP_H264" compression="40" audio="0" resolution="' + videoWidth + 'x' + videoHeight + '" variant="basic" autoplay></media-stream-player>';
	$('#video').empty().append(player);
}

function initPolygonSelector() {
	if (polygonSelector) return;
	polygonSelector = new PolygonSelector('settings-canvas', { minPoints: 3, maxPoints: 8, enabled: $('#aoiEnabled').is(':checked'), onchange: function() {} });
}

function loadSettings() {
	$.ajax({ type: 'GET', url: 'settings', dataType: 'json', cache: false,
		success: function(settings) {
			currentSettings = settings || {};
			const occupancy = ((currentSettings.transmission || {}).occupancy || {});
			$('#occupancyType').val(normalizeOccupancyType(occupancy.type));
			$('input[name="occupancyLabel"][value="' + (occupancy.label === 'vehicle' ? 'vehicle' : 'human') + '"]').prop('checked', true);
			const aoi = occupancy.aoi || {};
			$('#aoiEnabled').prop('checked', !!aoi.enabled);
			setPolygonPoints(aoi.points || [
				{ x: aoi.x1 ?? 0, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y2 ?? 1000 },
				{ x: aoi.x1 ?? 0, y: aoi.y2 ?? 1000 }
			]);
			updateModeControls();
			updateOccupancyStatus();
		}
	});
}

function normalizeOccupancyType(value) {
	const normalized = String(value || '').toLowerCase();
	return normalized === 'areabalance' ? 'areaBalance' : 'maximum';
}

function updateModeControls() {
	const aoiEnabled = $('#aoiEnabled').is(':checked');
	const typeSelect = $('#occupancyType');
	const selectedType = normalizeOccupancyType(typeSelect.val());
	typeSelect.find('option[value="areaBalance"]').prop('disabled', !aoiEnabled);

	let effectiveType = selectedType;
	if (!aoiEnabled && selectedType === 'areaBalance') {
		effectiveType = 'maximum';
		typeSelect.val('maximum');
	}

	if (effectiveType === 'areaBalance') {
		$('.area-balance-value').show();
		$('#intervalMaximumWrap').hide();
	} else {
		$('.area-balance-value').hide();
		$('#intervalMaximumWrap').show();
	}

	$('#aoiEnabled').prop('disabled', false);
	if (polygonSelector) polygonSelector.setEnabled(aoiEnabled);
}

function setPolygonPoints(points) {
	if (!polygonSelector) initPolygonSelector();
	if (polygonSelector) { polygonSelector.setEnabled($('#aoiEnabled').is(':checked')); polygonSelector.setPoints(points); }
}

function readPolygonPoints() {
	if (!polygonSelector) initPolygonSelector();
	return polygonSelector ? polygonSelector.getPoints() : [];
}

function polygonBounds(points) {
	let x1 = 1000, y1 = 1000, x2 = 0, y2 = 0;
	points.forEach(function(point) { x1 = Math.min(x1, point.x); y1 = Math.min(y1, point.y); x2 = Math.max(x2, point.x); y2 = Math.max(y2, point.y); });
	return { x1, y1, x2, y2 };
}

function saveOccupancy() {
	const transmission = currentSettings.transmission || {};
	const existingOccupancy = transmission.occupancy || {};
	const aoiEnabled = $('#aoiEnabled').is(':checked');
	const type = (aoiEnabled ? normalizeOccupancyType($('#occupancyType').val()) : 'maximum');
	const points = readPolygonPoints();
	const bounds = polygonBounds(points);
	transmission.occupancy = Object.assign({ port: 2, enabled: false }, existingOccupancy, {
		type: type,
		label: $('input[name="occupancyLabel"]:checked').val() || 'human',
		aoi: { enabled: aoiEnabled, x1: bounds.x1, x2: bounds.x2, y1: bounds.y1, y2: bounds.y2, points: points }
	});
	$.ajax({ type: 'POST', url: 'settings', data: JSON.stringify({ transmission }), contentType: 'application/json',
		success: function() { currentSettings.transmission = transmission; showToast('Occupancy saved', 'success'); },
		error: function(xhr, status, error) { showToast('Failed to save Occupancy: ' + error, 'danger'); }
	});
}

function readOccupancyTranslatorConfig() {
	const points = (readPolygonPoints() || []).slice(0, 10);
	const intervalMinutes = Number((((currentSettings.transmission || {}).occupancy || {}).intervalMinutes) || 15);
	return {
		enabled: true,
		protocolVersion: 1,
		label: $('input[name="occupancyLabel"]:checked').val() || 'human',
		intervalMinutes: intervalMinutes,
		intervalMin: intervalMinutes,
		type: occupancyTypeNameFromUiValue($('#occupancyType').val()),
		aoi: { enabled: $('#aoiEnabled').is(':checked'), pointCount: points.length, points: points }
	};
}

function occupancyOtaByte(value) { return value & 0xff; }

function occupancyClamp(value, minValue, maxValue) {
	const n = Number(value);
	if (!Number.isFinite(n)) return minValue;
	if (n < minValue) return minValue;
	if (n > maxValue) return maxValue;
	return Math.round(n);
}

function occupancyOtaBytesToHex(bytes) {
	return (bytes || []).map(function(value) { return ('0' + occupancyOtaByte(value).toString(16)).slice(-2); }).join('').toUpperCase();
}

function occupancyOtaHexToBytes(hex) {
	const clean = String(hex || '').replace(/\s+/g, '').toUpperCase();
	if (!clean.length) return [];
	if (clean.length % 2 !== 0 || !/^[0-9A-F]+$/.test(clean)) throw new Error('HEX must be even-length hexadecimal string');
	const bytes = [];
	for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.substr(i, 2), 16));
	return bytes;
}

function occupancyOtaWriteU16BE(out, value) {
	const v = occupancyClamp(value, 0, 65535);
	out.push((v >> 8) & 0xff);
	out.push(v & 0xff);
}

function occupancyOtaReadU16BE(bytes, index) {
	return (occupancyOtaByte(bytes[index]) << 8) | occupancyOtaByte(bytes[index + 1]);
}

function occupancyOtaCrc8(bytes) {
	let crc = 0;
	for (let i = 0; i < bytes.length; i++) {
		crc ^= occupancyOtaByte(bytes[i]);
		for (let bit = 0; bit < 8; bit++) {
			if (crc & 0x80) crc = ((crc << 1) ^ 0x07) & 0xff;
			else crc = (crc << 1) & 0xff;
		}
	}
	return crc & 0xff;
}

function occupancyTypeNameFromUiValue(value) {
	return normalizeOccupancyType(value) === 'areaBalance' ? 'Area Balance' : 'Interval Maximum';
}

function occupancyTypeToCode(value) {
	if (typeof value !== 'string') throw new Error('config.type must be "Interval Maximum" or "Area Balance"');
	const t = value.trim().toLowerCase();
	if (t === 'area balance') return 2;
	if (t === 'interval maximum') return 1;
	throw new Error('config.type must be "Interval Maximum" or "Area Balance"');
}

function occupancyCodeToTypeName(code) {
	if (code === 2) return 'Area Balance';
	if (code === 1) return 'Interval Maximum';
	return 'Unknown';
}

function occupancyBuildConfigBody(config) {
	const cfg = config || {};
	const aoi = cfg.aoi || {};
	const points = (aoi.points || []).slice(0, 10).map(function(point) {
		return { x: occupancyClamp(point.x, 0, 1000), y: occupancyClamp(point.y, 0, 1000) };
	});
	const aoiEnabled = !!aoi.enabled;
	if (aoiEnabled && points.length < 3) throw new Error('AOI enabled requires 3 to 10 points');

	const body = [];
	body.push(occupancyClamp(cfg.protocolVersion || 1, 1, 255));
	body.push((cfg.enabled ? 1 : 0) | (String(cfg.label || 'human').toLowerCase() === 'vehicle' ? 2 : 0) | (aoiEnabled ? 4 : 0));
	body.push(occupancyClamp(cfg.intervalMin || cfg.intervalMinutes, 1, 60));
	body.push(aoiEnabled ? points.length : 0);

	for (let i = 0; i < 10; i++) {
		const point = i < points.length ? points[i] : { x: 0, y: 0 };
		occupancyOtaWriteU16BE(body, point.x);
		occupancyOtaWriteU16BE(body, point.y);
	}
	body.push(occupancyTypeToCode(cfg.type));
	body.push(0);
	body.push(0);
	body.push(occupancyOtaCrc8(body));

	if (body.length !== 48) throw new Error('Config body must be 48 bytes');
	return body;
}

function occupancyParseConfigBody(body) {
	if (!body || body.length !== 48) throw new Error('Config body must be 48 bytes');
	if (occupancyOtaCrc8(body.slice(0, 47)) !== occupancyOtaByte(body[47])) throw new Error('Config CRC mismatch');

	const flags = occupancyOtaByte(body[1]);
	const pointCount = occupancyOtaByte(body[3]);
	if (pointCount > 10) throw new Error('Invalid pointCount');
	if ((flags & 0x04) && pointCount > 0 && pointCount < 3) throw new Error('AOI enabled with fewer than 3 points');

	const points = [];
	for (let i = 0; i < 10; i++) {
		const base = 4 + (i * 4);
		const x = occupancyOtaReadU16BE(body, base);
		const y = occupancyOtaReadU16BE(body, base + 2);
		if (i < pointCount) points.push({ x, y });
	}

	return {
		protocolVersion: occupancyOtaByte(body[0]),
		enabled: (flags & 0x01) !== 0,
		label: (flags & 0x02) !== 0 ? 'vehicle' : 'human',
		intervalMinutes: occupancyOtaByte(body[2]),
		intervalMin: occupancyOtaByte(body[2]),
		type: occupancyCodeToTypeName(occupancyOtaByte(body[44])),
		aoi: { enabled: (flags & 0x04) !== 0, pointCount, points },
		crc8: occupancyOtaByte(body[47])
	};
}

function Encode(config, command) {
	const cmd = occupancyOtaByte(command);
	if (cmd === 0x01 || cmd === 0x03) return occupancyOtaBytesToHex([cmd]);
	if (cmd !== 0x02) throw new Error('Unsupported command for JSON encode');
	return occupancyOtaBytesToHex([0x02].concat(occupancyBuildConfigBody(config || {})));
}

function Decode(input) {
	const bytes = occupancyOtaHexToBytes(input);
	if (!bytes.length) throw new Error('Empty payload');

	const cmd = occupancyOtaByte(bytes[0]);
	const names = {
		0x01: 'GET_CONFIG',
		0x02: 'SET_CONFIG',
		0x03: 'GET_CAPS',
		0x81: 'GET_CONFIG_RESP',
		0x82: 'SET_CONFIG_ACK',
		0x83: 'GET_CAPS_RESP'
	};

	if (cmd === 0x01 || cmd === 0x03) return {
		port: 132,
		command: cmd,
		type: cmd === 0x01 ? 'get_config_request' : 'get_caps_request'
	};

	if (cmd === 0x02 || cmd === 0x81) {
		if (bytes.length !== 49) throw new Error('Config request/response must be 49 bytes');
		return {
			port: 132,
			command: cmd,
			type: cmd === 0x02 ? 'set_config_request' : 'get_config_response',
			config: occupancyParseConfigBody(bytes.slice(1))
		};
	}

	if (cmd === 0x82) {
		if (bytes.length !== 5) throw new Error('ACK/NACK must be 5 bytes');
		if (occupancyOtaCrc8(bytes.slice(0, 4)) !== occupancyOtaByte(bytes[4])) throw new Error('ACK/NACK CRC mismatch');
		return {
			port: 132,
			command: cmd,
			type: 'set_config_ack',
			version: occupancyOtaByte(bytes[1]),
			ackFor: occupancyOtaByte(bytes[2]),
			status: occupancyOtaByte(bytes[3]),
			success: occupancyOtaByte(bytes[3]) === 0
		};
	}

	if (cmd === 0x83) {
		if (bytes.length !== 13) throw new Error('Capabilities response must be 13 bytes');
		const payload = bytes.slice(1);
		if (occupancyOtaCrc8(payload.slice(0, 11)) !== occupancyOtaByte(payload[11])) throw new Error('Capabilities CRC mismatch');
		return {
			port: 132,
			command: cmd,
			type: 'get_caps_response',
			version: occupancyOtaByte(payload[0]),
			maxPolygonPoints: occupancyOtaByte(payload[1]),
			coordEncoding: occupancyOtaByte(payload[2]),
			coordEncodingName: occupancyOtaByte(payload[2]) === 1 ? 'uint16_0_1000' : 'unknown',
			minIntervalMin: occupancyOtaByte(payload[3]),
			maxIntervalMin: occupancyOtaByte(payload[4]),
			minAreaPoints: occupancyOtaReadU16BE(payload, 5),
			maxAreaPoints: occupancyOtaReadU16BE(payload, 7),
			minType: occupancyOtaByte(payload[9]),
			maxType: occupancyOtaByte(payload[10]),
			minTypeName: occupancyCodeToTypeName(occupancyOtaByte(payload[9])),
			maxTypeName: occupancyCodeToTypeName(occupancyOtaByte(payload[10])),
			constraints: {
				intervalMin: [occupancyOtaByte(payload[3]), occupancyOtaByte(payload[4])],
				areaPoints: [occupancyOtaReadU16BE(payload, 5), occupancyOtaReadU16BE(payload, 7)],
				occupancyType: [occupancyOtaByte(payload[9]), occupancyOtaByte(payload[10])],
				occupancyTypeName: [occupancyCodeToTypeName(occupancyOtaByte(payload[9])), occupancyCodeToTypeName(occupancyOtaByte(payload[10]))],
				maxPolygonPoints: occupancyOtaByte(payload[1])
			}
		};
	}

	throw new Error('Unsupported command byte: 0x' + cmd.toString(16).toUpperCase());
}

function loadOccupancyTranslatorJsonFromForm(notify) {
	const config = readOccupancyTranslatorConfig();
	$('#occupancy-json-input').val(JSON.stringify(config, null, 2));
	if (notify !== false) showToast('Encoder/Decoder JSON loaded from form', 'info');
}

function setOccupancyHexOutput(hex) {
	$('#occupancy-hex-output').val(String(hex || '').toUpperCase());
}

function buildOccupancyOtaTranslatorScript() {
	const generatedDate = new Date().toISOString().slice(0, 10);
	const header = [
		'/**',
		' * AI-B100 Occupancy OTA Translator',
		' * Generated: ' + generatedDate,
		' *',
		' * Port',
		' * - Occupancy OTA uses dedicated port 132 for both requests and responses.',
		' *',
		' * Public API',
		' * - Encode(config, command) : JSON -> HEX payload',
		' * - Decode(input)           : HEX -> JSON',
		' */'
	].join('\n');

	const parts = [
		header,
		'var AI_B100_OCCUPANCY_OTA_PORT = 132;',
		'var AI_B100_OCCUPANCY_OTA_MAX_POINTS = 10;',
		occupancyOtaByte.toString(),
		occupancyClamp.toString(),
		occupancyOtaBytesToHex.toString(),
		occupancyOtaHexToBytes.toString(),
		occupancyOtaWriteU16BE.toString(),
		occupancyOtaReadU16BE.toString(),
		occupancyOtaCrc8.toString(),
		occupancyTypeToCode.toString(),
		occupancyCodeToTypeName.toString(),
		occupancyBuildConfigBody.toString(),
		occupancyParseConfigBody.toString(),
		Encode.toString(),
		Decode.toString(),
		'var aiB100OccupancyOtaJsonToHex = Encode;',
		'var aiB100OccupancyOtaBufferToJson = Decode;'
	];

	return parts.join('\n\n') + '\n';
}

function downloadOccupancyOtaTranslator() {
	try {
		const text = buildOccupancyOtaTranslatorScript();
		if (!text.trim().length) throw new Error('Generated translator is empty');
		if (text.indexOf('function Encode') === -1 || text.indexOf('function Decode') === -1) throw new Error('Generated translator is invalid');

		const blob = new Blob([text], { type: 'application/javascript' });
		const url = URL.createObjectURL(blob);
		const link = document.createElement('a');
		link.href = url;
		link.download = 'AI-B100-Occupancy-OTA.js';
		document.body.appendChild(link);
		link.click();
		link.remove();
		URL.revokeObjectURL(url);
		showToast('Occupancy OTA translator downloaded', 'success');
	} catch (error) {
		showToast('Failed to download Occupancy OTA translator: ' + error.message, 'danger');
	}
}

function buildOccupancySetFromJson() {
	try {
		const parsed = JSON.parse($('#occupancy-json-input').val() || '{}');
		setOccupancyHexOutput(Encode(parsed, 0x02));
		showToast('Occupancy OTA Set Config built for port 132', 'success');
	} catch (error) {
		showToast('Failed to build Occupancy OTA Set Config: ' + error.message, 'danger');
	}
}

function decodeOccupancyHexInput() {
	try {
		const decoded = Decode($('#occupancy-hex-input').val() || '');
		$('#occupancy-json-output').val(JSON.stringify(decoded, null, 2));
		showToast('Payload decoded', 'success');
	} catch (error) {
		$('#occupancy-json-output').val('');
		showToast('Decode failed: ' + error.message, 'danger');
	}
}

function updateOccupancyStatus() {
	$.ajax({ type: 'GET', url: 'counters', dataType: 'json', cache: false,
		success: function(data) {
			const publish = ((data || {}).publish || {}).occupancy || {};
			const balance = (data || {}).occupancyAreaBalance || {};
			$('#intervalMaximumValue').text(publish.count || 0);
			$('#occupancyEntering').text(balance.entering || 0);
			$('#occupancyExiting').text(balance.exiting || 0);
		}
	});
}

function pollLoraStatus() {
	$.ajax({ type: 'GET', url: 'status', dataType: 'json', cache: false,
		success: function(d) { const dot = $('#lora-nav-dot'); const lw = d && d.lorawan; dot.removeClass('lora-joined lora-connected lora-disconnected'); if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined'); else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined'); else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected'); }
	});
}
</script>
</body>
</html>
