<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/media-stream-player.min.js"></script>
	<script src="js/polygonselect.js"></script>
	<script src="js/toast.js"></script>
	<style>
		#video-view { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
		#video { position: absolute; inset: 0; width: 100%; height: 100%; }
		#settings-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: auto; }
		.speed-value { font-size: 1.4rem; font-weight: 600; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="card mb-4">
			<div class="card-header d-flex justify-content-between align-items-center">
				<h5 class="card-title mb-0">Speed</h5>
				<span class="badge text-bg-light">Port 4</span>
			</div>
			<div class="card-body">
				<div class="row g-3 align-items-end">
					<div class="col-12 col-md-3">
						<label class="form-label d-block">Output Unit</label>
						<div class="btn-group" role="group" aria-label="Speed unit">
							<input type="radio" class="btn-check" name="speedUnit" id="speedUnitKmh" value="kmh" autocomplete="off">
							<label class="btn btn-outline-primary" for="speedUnitKmh">km/h</label>
							<input type="radio" class="btn-check" name="speedUnit" id="speedUnitMph" value="mph" autocomplete="off">
							<label class="btn btn-outline-primary" for="speedUnitMph">mph</label>
						</div>
					</div>
					<div class="col-12 col-md-3">
						<label for="speedLimit" class="form-label">Speed Limit (<span class="speed-unit-label">km/h</span>)</label>
						<input type="number" class="form-control" id="speedLimit" min="1" max="255" value="50">
					</div>
					<div class="col-12 col-md-6">
						<div class="form-check form-switch mt-4">
							<input class="form-check-input" type="checkbox" id="aoiEnabled">
							<label class="form-check-label" for="aoiEnabled">Area of Interest</label>
						</div>
					</div>
				</div>

				<div class="mt-3">
					<div id="video-view">
						<div id="video"></div>
						<canvas id="settings-canvas" width="1000" height="1000"></canvas>
					</div>
					<div class="form-text mt-2">Click an edge to add a point (maximum 8), drag a point to move it, double-click a point to remove it.</div>
				</div>

				<div class="mt-3">
					<button id="saveSpeed" class="btn btn-primary">Save</button>
				</div>
			</div>
		</div>

		<div class="card mb-4">
			<div class="card-header d-flex justify-content-between align-items-center">
				<h5 class="card-title mb-0">Last Published</h5>
				<span class="text-muted" id="lastPublishTime">Never</span>
			</div>
			<div class="card-body">
				<div class="row g-3 text-center">
					<div class="col-6 col-md"><div class="text-muted">Vehicles</div><div class="speed-value" id="lastVehicles">--</div></div>
					<div class="col-6 col-md"><div class="text-muted">Speeding</div><div class="speed-value" id="lastSpeeding">--</div></div>
					<div class="col-6 col-md"><div class="text-muted">Maximum</div><div class="speed-value" id="lastMaximum">--</div></div>
					<div class="col-6 col-md"><div class="text-muted">Average</div><div class="speed-value" id="lastAverage">--</div></div>
					<div class="col-6 col-md"><div class="text-muted">Minimum</div><div class="speed-value" id="lastMinimum">--</div></div>
				</div>
				<hr>
				<div class="row g-3 text-center text-muted">
					<div class="col-12"><small>Current interval so far</small></div>
					<div class="col-6 col-md"><div>Vehicles</div><div id="currentVehicles">--</div></div>
					<div class="col-6 col-md"><div>Speeding</div><div id="currentSpeeding">--</div></div>
					<div class="col-6 col-md"><div>Maximum</div><div id="currentMaximum">--</div></div>
					<div class="col-6 col-md"><div>Average</div><div id="currentAverage">--</div></div>
					<div class="col-6 col-md"><div>Minimum</div><div id="currentMinimum">--</div></div>
				</div>
			</div>
		</div>
	</div>

<script>
let currentSettings = {};
let polygonSelector = null;

$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			playVideo(app.device && app.device.aspect ? app.device.aspect : '16:9');
			loadSettings();
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});
	$('#aoiEnabled').on('change', function() {
		if (polygonSelector) polygonSelector.setEnabled($(this).is(':checked'));
	});
	$('input[name="speedUnit"]').on('change', updateUnitLabels);
	$('#saveSpeed').on('click', saveSpeed);
	setInterval(updateSpeedStatus, 3000);
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function playVideo(aspect) {
	let videoWidth = 1280;
	let videoHeight = 720;
	let ratio = '16 / 9';
	if (aspect === '4:3') { videoWidth = 800; videoHeight = 600; ratio = '4 / 3'; }
	else if (aspect === '1:1') { videoWidth = 640; videoHeight = 640; ratio = '1 / 1'; }
	else if (aspect === '16:10') { videoWidth = 800; videoHeight = 500; ratio = '16 / 10'; }
	$('#video-view').css('aspect-ratio', ratio);
	initPolygonSelector();
	const secureConnection = location.protocol === 'https:' ? ' secure=true' : '';
	const player = '<media-stream-player hostname="' + window.location.hostname + '"' + secureConnection + ' format="RTP_H264" compression="40" audio="0" resolution="' + videoWidth + 'x' + videoHeight + '" variant="basic" autoplay></media-stream-player>';
	$('#video').empty().append(player);
}

function initPolygonSelector() {
	if (polygonSelector) return;
	polygonSelector = new PolygonSelector('settings-canvas', { minPoints: 3, maxPoints: 8, enabled: $('#aoiEnabled').is(':checked'), onchange: function() {} });
}

function loadSettings() {
	$.ajax({ type: 'GET', url: 'settings', dataType: 'json', cache: false,
		success: function(settings) {
			currentSettings = settings || {};
			const speed = ((currentSettings.transmission || {}).speed || {});
			$('input[name="speedUnit"][value="' + (speed.unit === 'mph' ? 'mph' : 'kmh') + '"]').prop('checked', true);
			$('#speedLimit').val(speed.speedLimit || 50);
			const aoi = speed.aoi || {};
			$('#aoiEnabled').prop('checked', !!aoi.enabled);
			setPolygonPoints(aoi.points && aoi.points.length >= 3 ? aoi.points : [
				{ x: aoi.x1 ?? 0, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y2 ?? 1000 },
				{ x: aoi.x1 ?? 0, y: aoi.y2 ?? 1000 }
			]);
			updateUnitLabels();
			updateSpeedStatus();
		}
	});
}

function selectedUnit() { return $('input[name="speedUnit"]:checked').val() === 'mph' ? 'mph' : 'kmh'; }
function unitLabel() { return selectedUnit() === 'mph' ? 'mph' : 'km/h'; }
function updateUnitLabels() { $('.speed-unit-label').text(unitLabel()); }

function setPolygonPoints(points) {
	if (!polygonSelector) initPolygonSelector();
	if (polygonSelector) { polygonSelector.setEnabled($('#aoiEnabled').is(':checked')); polygonSelector.setPoints(points); }
}

function readPolygonPoints() {
	if (!polygonSelector) initPolygonSelector();
	return polygonSelector ? polygonSelector.getPoints() : [];
}

function polygonBounds(points) {
	let x1 = 1000, y1 = 1000, x2 = 0, y2 = 0;
	points.forEach(function(point) { x1 = Math.min(x1, point.x); y1 = Math.min(y1, point.y); x2 = Math.max(x2, point.x); y2 = Math.max(y2, point.y); });
	return { x1, y1, x2, y2 };
}

function saveSpeed() {
	const limit = parseInt($('#speedLimit').val(), 10);
	if (!Number.isFinite(limit) || limit < 1 || limit > 255) return showToast('Speed limit must be between 1 and 255', 'warning');
	const transmission = currentSettings.transmission || {};
	const existing = transmission.speed || {};
	const aoiEnabled = $('#aoiEnabled').is(':checked');
	const points = readPolygonPoints();
	const bounds = polygonBounds(points);
	transmission.speed = Object.assign({ port: 4, enabled: false, intervalMinutes: 15 }, existing, {
		unit: selectedUnit(),
		speedLimit: limit,
		aoi: { enabled: aoiEnabled, x1: bounds.x1, x2: bounds.x2, y1: bounds.y1, y2: bounds.y2, points: points }
	});
	$.ajax({ type: 'POST', url: 'settings', data: JSON.stringify({ transmission }), contentType: 'application/json',
		success: function() { currentSettings.transmission = transmission; showToast('Speed saved', 'success'); },
		error: function(xhr, status, error) { showToast('Failed to save Speed: ' + error, 'danger'); }
	});
}

function updateSpeedStatus() {
	$.getJSON('counters').done(function(data) {
		const speed = ((data || {}).publish || {}).speed || {};
		const last = speed.last;
		const unit = speed.unit || unitLabel();
		if (last) {
			$('#lastVehicles').text(last.vehicles);
			$('#lastSpeeding').text(last.speeding);
			$('#lastMaximum').text(last.maximum + ' ' + unit);
			$('#lastAverage').text(last.average + ' ' + unit);
			$('#lastMinimum').text(last.minimum + ' ' + unit);
			$('#lastPublishTime').text(last.publishTime ? new Date(last.publishTime * 1000).toLocaleString() : 'Never');
		}
		const current = speed.current || {};
		$('#currentVehicles').text(current.vehicles ?? '--');
		$('#currentSpeeding').text(current.speeding ?? '--');
		$('#currentMaximum').text(formatSpeed(current.maximum, unit));
		$('#currentAverage').text(formatSpeed(current.average, unit));
		$('#currentMinimum').text(formatSpeed(current.minimum, unit));
	});
}

function formatSpeed(value, unit) {
	if (value === undefined || value === null) return '--';
	return Math.round(value) + ' ' + unit;
}

function pollLoraStatus() {
	$.getJSON('status').done(function(data) {
		const dot = $('#lora-nav-dot'), lw = data && data.lorawan;
		dot.removeClass('lora-joined lora-connected lora-disconnected');
		if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
		else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
		else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
	});
}
</script>
</body>
</html>
