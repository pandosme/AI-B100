<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/media-stream-player.min.js"></script>
	<script src="js/polygonselect.js"></script>
	<script src="js/toast.js"></script>
	<style>
		#video-view {
			width: 100%;
			max-width: 960px;
			aspect-ratio: 16 / 9;
			background: #000;
			position: relative;
			overflow: hidden;
		}
		#video {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
		}
		#settings-canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 10;
			pointer-events: auto;
		}
		.object-table { font-size: 0.9rem; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar">
			<a href="index.html">Publish</a>
			<a href="aoa.html" class="active">Radar</a>
			<a href="bridge.html">LoRA Bridge</a>
			<a href="downlink.html">LoRA Downlink</a>
			<a href="gps.html">GPS</a>
			<a href="about.html">About</a>
			<span id="lora-nav-dot" class="lora-nav-dot" title="LoRaWAN status">&#9679; LoRa</span>
		</nav>
	</header>

	<div class="page-content">
		<div class="card mb-4">
			<div class="card-header"><h5 class="card-title mb-0">Live Stream</h5></div>
			<div class="card-body">
				<div id="video-view">
					<div id="video"></div>
					<canvas id="settings-canvas" width="1000" height="1000"></canvas>
				</div>
			</div>
		</div>

		<div class="card mb-4">
			<div class="card-header"><h5 class="card-title mb-0">Settings</h5></div>
			<div class="card-body">
				<div class="row g-3 align-items-end">
					<div class="col-12 col-md-4">
						<label for="occupancyMode" class="form-label">Mode</label>
						<select id="occupancyMode" class="form-select">
							<option value="maximum">Interval peak</option>
							<option value="entry_exit">Area balance</option>
							<option value="alert">Presence alert</option>
						</select>
					</div>
					<div class="col-12 col-md-4">
						<label class="form-label d-block">Object Type</label>
						<div class="btn-group" role="group" aria-label="Object type">
							<input type="radio" class="btn-check" name="objectClass" id="objectHuman" value="human" autocomplete="off">
							<label class="btn btn-outline-primary" for="objectHuman">Human</label>
							<input type="radio" class="btn-check" name="objectClass" id="objectVehicle" value="vehicle" autocomplete="off">
							<label class="btn btn-outline-primary" for="objectVehicle">Vehicle</label>
						</div>
					</div>
					<div class="col-12 col-md-4">
						<div class="form-check form-switch mb-2">
							<input class="form-check-input" type="checkbox" id="aoiEnabled">
							<label class="form-check-label" for="aoiEnabled">Area of Interest</label>
						</div>
						<button id="saveRadar" class="btn btn-primary">Save Radar</button>
						<button id="resetRadar" class="btn btn-outline-danger ms-2">Reset State</button>
					</div>
				</div>
			</div>
		</div>

		<div class="card mb-4">
			<div class="card-header"><h5 class="card-title mb-0">Live Status</h5></div>
			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-3"><div class="text-muted">Status</div><strong id="radarConnected">--</strong></div>
					<div class="col-md-3"><div class="text-muted">Occupancy</div><strong id="radarOccupancy">0</strong></div>
					<div class="col-md-3"><div class="text-muted">Tracked Objects</div><strong id="trackedObjects">0</strong></div>
					<div class="col-md-3"><div class="text-muted">Last Frame</div><strong id="lastFrame">--</strong></div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="card-header"><h5 class="card-title mb-0">Radar Objects</h5></div>
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-sm object-table">
						<thead><tr><th>ID</th><th>Class</th><th>Confidence</th><th>Speed</th><th>Last Seen</th><th>State</th></tr></thead>
						<tbody id="objectRows"><tr><td colspan="6" class="text-muted text-center">No objects tracked</td></tr></tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

<script>
let polygonSelector = null;

$(document).ready(function() {
	$.ajax({ type: 'GET', url: 'app', dataType: 'json', cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			playVideo(app.device && app.device.aspect ? app.device.aspect : '16:9');
			loadSettings();
			loadRadar();
			setInterval(loadRadar, 2000);
		},
		error: function(response) { showToast('Failed to load application: ' + response.statusText, 'danger'); }
	});

	$('#aoiEnabled').on('change', function() { if (polygonSelector) polygonSelector.setEnabled($(this).is(':checked')); });
	$('#saveRadar').on('click', saveRadarSettings);
	$('#resetRadar').on('click', resetRadar);
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();
});

function playVideo(aspect) {
	let videoWidth = 1280;
	let videoHeight = 720;
	let ratio = '16 / 9';

	switch (aspect) {
		case '4:3':
			videoWidth = 800;
			videoHeight = 600;
			ratio = '4 / 3';
			break;
		case '1:1':
			videoWidth = 640;
			videoHeight = 640;
			ratio = '1 / 1';
			break;
		case '16:10':
			videoWidth = 800;
			videoHeight = 500;
			ratio = '16 / 10';
			break;
		default:
			break;
	}

	$('#video-view').css('aspect-ratio', ratio);
	initPolygonSelector();
	const secureConnection = location.protocol === 'https:' ? ' secure=true' : '';
	const player = '<media-stream-player hostname="' + window.location.hostname + '"' + secureConnection +
		' format="RTP_H264" compression="40" audio="0"' +
		' resolution="' + videoWidth + 'x' + videoHeight + '"' +
		' variant="basic" autoplay></media-stream-player>';
	$('#video').empty().append(player);
}

function initPolygonSelector() {
	if (polygonSelector) return;
	polygonSelector = new PolygonSelector('settings-canvas', {
		minPoints: 3,
		maxPoints: 8,
		enabled: $('#aoiEnabled').is(':checked'),
		onchange: function() {}
	});
}

function loadSettings() {
	$.ajax({ type: 'GET', url: 'settings', dataType: 'json', cache: false,
		success: function(settings) {
			window.currentSettings = settings;
			const radar = settings.radar || {};
			$('#occupancyMode').val(radar.occupancyMode || 'maximum');
			const objectClass = String(radar.objectClass || 'human').toLowerCase() === 'vehicle' ? 'vehicle' : 'human';
			$('input[name="objectClass"][value="' + objectClass + '"]').prop('checked', true);
			const aoi = radar.aoi || {};
			$('#aoiEnabled').prop('checked', !!aoi.enabled);
			setPolygonPoints(aoi.points || [
				{ x: aoi.x1 ?? 0, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y1 ?? 0 },
				{ x: aoi.x2 ?? 1000, y: aoi.y2 ?? 1000 },
				{ x: aoi.x1 ?? 0, y: aoi.y2 ?? 1000 }
			]);
		}
	});
}

function setPolygonPoints(points) {
	if (!polygonSelector) initPolygonSelector();
	if (polygonSelector) {
		polygonSelector.setEnabled($('#aoiEnabled').is(':checked'));
		polygonSelector.setPoints(points);
	}
}

function readPolygonPoints() {
	if (!polygonSelector) initPolygonSelector();
	return polygonSelector ? polygonSelector.getPoints() : [];
}

function polygonBounds(points) {
	let x1 = 1000, y1 = 1000, x2 = 0, y2 = 0;
	points.forEach(function(point) {
		x1 = Math.min(x1, point.x);
		y1 = Math.min(y1, point.y);
		x2 = Math.max(x2, point.x);
		y2 = Math.max(y2, point.y);
	});
	return { x1, y1, x2, y2 };
}

function saveRadarSettings() {
	const current = window.currentSettings || {};
	const currentTransmission = current.transmission || {};
	const points = readPolygonPoints();
	const bounds = polygonBounds(points);
	const settings = {
		transmission: Object.assign({}, currentTransmission, { classes: {
			human: $('input[name="objectClass"]:checked').val() === 'human',
			vehicle: $('input[name="objectClass"]:checked').val() === 'vehicle',
			unknown: false
		} }),
		radar: {
			occupancyMode: $('#occupancyMode').val(),
			objectClass: $('input[name="objectClass"]:checked').val() || 'human',
			staleTimeoutSeconds: 60,
			minDwellSeconds: 0,
			minConfidence: 30,
			aoi: {
				enabled: $('#aoiEnabled').is(':checked'),
				x1: bounds.x1,
				x2: bounds.x2,
				y1: bounds.y1,
				y2: bounds.y2,
				points: points
			}
		}
	};
	$.ajax({ type: 'POST', url: 'settings', data: JSON.stringify(settings), contentType: 'application/json',
			success: function() { showToast('Radar saved', 'success'); loadRadar(); },
			error: function(xhr, status, error) { showToast('Failed to save radar: ' + error, 'danger'); }
	});
}

function resetRadar() {
	$.ajax({ type: 'POST', url: 'radar_reset', success: function() { showToast('Radar state reset', 'success'); loadRadar(); },
		error: function(xhr) { showToast('Reset failed: ' + xhr.responseText, 'danger'); }
	});
}

function loadRadar() {
	$.ajax({ type: 'GET', url: 'radar', dataType: 'json', cache: false,
		success: function(data) {
			const occ = data.peakOccupancy || data.occupancy || {};
			$('#radarConnected').text(data.connected ? 'Connected' : 'Disconnected');
			$('#radarOccupancy').text(occ.total || 0);
			$('#trackedObjects').text(data.trackedObjects || 0);
			$('#lastFrame').text(data.lastFrameAgeSeconds >= 0 ? data.lastFrameAgeSeconds + ' s ago' : '--');
			renderObjects(data.objects || []);
		}
	});
}

function renderObjects(objects) {
	const tbody = $('#objectRows');
	tbody.empty();
	if (!objects.length) {
		tbody.html('<tr><td colspan="6" class="text-muted text-center">No objects tracked</td></tr>');
		return;
	}
	objects.forEach(function(obj) {
		const state = obj.valid ? (obj.active ? 'active' : 'retained') : 'filtered';
		tbody.append(`<tr><td>${obj.id}</td><td>${obj.class}</td><td>${obj.confidence}%</td><td>${Number(obj.speed || 0).toFixed(1)}</td><td>${obj.lastSeenSeconds}s</td><td>${state}</td></tr>`);
	});
}

function pollLoraStatus() {
	$.ajax({ type: 'GET', url: 'status', dataType: 'json', cache: false,
		success: function(d) {
			const dot = $('#lora-nav-dot');
			const lw = d && d.lorawan;
			dot.removeClass('lora-joined lora-connected lora-disconnected');
			if (lw && lw.joined) dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
			else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
			else dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
		}
	});
}
</script>
</body>
</html>
