<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title></title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/pages.js"></script>
	<script src="js/chrome.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/toast.js"></script>
	<script src="js/media-stream-player.min.js"></script>
	<style>
		.video-container { position: relative; background: #000; }
		canvas { cursor: crosshair; }
		.btn-group-sm .btn { font-size: 0.875rem; }
	</style>
</head>
<body>
	<header class="app-header">
		<div class="app-name" id="app-name">&nbsp;</div>
		<nav class="nav-bar" id="nav-bar"></nav>
	</header>

	<div class="page-content">
		<div class="mb-3">
			<button id="btn-add-occupancy" class="btn btn-success">+ Add Occupancy</button>
		</div>

		<div id="occupancy-container" class="row">
			<!-- Occupancy cards will be dynamically added here -->
		</div>
	</div>

<script>
let occupancyScenarios = [];
let occupancySamples = {};
let occupancySampleSignatures = {};
let publishSettings = {};
const VIDEO_WIDTH = 640;
const VIDEO_HEIGHT = 360;
const OCCUPANCY_TYPE = 'occupancyInArea';
const ALL_OBJECT_CLASSIFICATIONS = [
	{type: "human"},
	{
		type: "vehicle",
		subTypes: [
			{type: "motorcycle/bicycle"},
			{type: "car"},
			{type: "bus"},
			{type: "truck"},
			{type: "unknown"}
		]
	}
];

function cloneAllObjectClassifications() {
	return JSON.parse(JSON.stringify(ALL_OBJECT_CLASSIFICATIONS));
}

function ensureAllObjectClassifications(predicate) {
	if (!window.aoaFullConfig || !window.aoaFullConfig.scenarios) return false;
	let changed = false;
	window.aoaFullConfig.scenarios.forEach(function(scenario) {
		if (!predicate(scenario)) return;
		if (!Array.isArray(scenario.objectClassifications)) {
			scenario.objectClassifications = [];
			changed = true;
		}

		if (!scenario.objectClassifications.some(item => item && item.type === "human")) {
			scenario.objectClassifications.push({type: "human"});
			changed = true;
		}

		let vehicle = scenario.objectClassifications.find(item => item && item.type === "vehicle");
		if (!vehicle) {
			vehicle = {type: "vehicle", subTypes: []};
			scenario.objectClassifications.push(vehicle);
			changed = true;
		}
		if (!Array.isArray(vehicle.subTypes)) {
			vehicle.subTypes = [];
			changed = true;
		}

		ALL_OBJECT_CLASSIFICATIONS[1].subTypes.forEach(function(requiredSubtype) {
			if (!vehicle.subTypes.some(item => item && item.type === requiredSubtype.type)) {
				vehicle.subTypes.push({type: requiredSubtype.type});
				changed = true;
			}
		});
	});
	return changed;
}

$(document).ready(function() {
	$.ajax({
		type: "GET",
		url: 'app',
		dataType: 'json',
		cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('#app-name').text(app.manifest.acapPackageConf.setup.friendlyName);
			loadOccupancyScenarios();
		},
		error: function(response) {
			showToast("Failed to load application: " + response.statusText, 'danger');
		}
	});

	function updateNavDot(data) {
		const dot = $('#lora-nav-dot');
		const lw = data && data.lorawan;
		dot.removeClass('lora-joined lora-connected lora-disconnected');
		if (lw && lw.joined)         dot.addClass('lora-joined').attr('title', 'LoRaWAN: Joined');
		else if (lw && lw.connected) dot.addClass('lora-connected').attr('title', 'LoRaWAN: Connected, not joined');
		else                         dot.addClass('lora-disconnected').attr('title', 'LoRaWAN: Disconnected');
	}
	function pollLoraStatus() {
		$.ajax({ type:'GET', url:'status', dataType:'json', cache:false,
			success: function(d) { updateNavDot(d); } });
	}
	setInterval(pollLoraStatus, 10000);
	pollLoraStatus();

	$('#btn-add-occupancy').on('click', addNewOccupancy);
	setInterval(loadOccupancySamples, 2000);
});

function defaultClassSelection() {
	return {human: true, car: true, bike: true, bus: true, truck: true, other: true};
}

function formatOccupancyValueType(valueType) {
	if (valueType === 'min') return 'Min';
	if (valueType === 'max') return 'Max';
	return 'Average';
}

function getOccupancyPublishSettings(scenarioName) {
	const transmission = publishSettings.transmission || {};
	const occupancy = transmission.occupancy || {};
	const scenarios = occupancy.scenarios || {};
	const scenarioConfig = scenarios[scenarioName] || {};
	return {
		value: scenarioConfig.value || occupancy.value || 'average',
		classes: Object.assign(defaultClassSelection(), occupancy.classes || {}, scenarioConfig.classes || {})
	};
}

function classCheckboxes(prefix, classes) {
	const labels = [
		['human', 'Humans'],
		['car', 'Cars'],
		['bike', 'Bikes'],
		['bus', 'Buses'],
		['truck', 'Trucks'],
		['other', 'Other Vehicles']
	];
	return labels.map(function(item) {
		const key = item[0];
		const label = item[1];
		const id = `${prefix}-${key}`;
		const checked = classes[key] !== false ? 'checked' : '';
		return `<div class="form-check form-check-inline"><input class="form-check-input publish-class" type="checkbox" id="${id}" data-class="${key}" ${checked}><label class="form-check-label" for="${id}">${label}</label></div>`;
	}).join('');
}

function readClassSelection(containerSelector) {
	const classes = {};
	$(containerSelector).find('.publish-class').each(function() {
		classes[$(this).data('class')] = $(this).is(':checked');
	});
	return classes;
}

function loadPublishSettings(callback) {
	$.ajax({
		type: "GET",
		url: 'settings',
		dataType: 'json',
		cache: false,
		success: function(settings) {
			publishSettings = settings || {};
			if (callback) callback();
		},
		error: function(xhr, status, error) {
			console.warn('Failed to load publish settings:', error);
			publishSettings = {};
			if (callback) callback();
		}
	});
}

function occupancyTransmissionConfig() {
	const transmission = publishSettings.transmission || {};
	const occupancy = transmission.occupancy || {};
	occupancy.scenarios = occupancy.scenarios || {};
	transmission.occupancy = occupancy;
	publishSettings.transmission = transmission;
	return { transmission, occupancy, scenarios: occupancy.scenarios };
}

function savePublishSettings(onSuccess, onError) {
	$.ajax({
		type: "POST",
		url: 'settings',
		data: JSON.stringify({ transmission: publishSettings.transmission || {} }),
		contentType: 'application/json',
		success: function() {
			if (onSuccess) onSuccess();
		},
		error: function(xhr, status, error) {
			if (onError) onError(error);
			else console.warn('Failed to save publish settings:', error);
		}
	});
}

function syncOccupancyPublishConfiguration(callback) {
	const config = occupancyTransmissionConfig();
	const occupancy = config.occupancy;
	const scenarios = config.scenarios;
	const validNames = {};
	let changed = false;

	occupancyScenarios.forEach(function(scenario) {
		const name = scenario.name || ('Occupancy ' + scenario.id);
		validNames[name] = true;
		if (!scenarios[name]) {
			scenarios[name] = {
				value: occupancy.value || 'average',
				classes: Object.assign(defaultClassSelection(), occupancy.classes || {})
			};
			changed = true;
		} else {
			if (!scenarios[name].value) {
				scenarios[name].value = occupancy.value || 'average';
				changed = true;
			}
			if (!scenarios[name].classes) {
				scenarios[name].classes = Object.assign(defaultClassSelection(), occupancy.classes || {});
				changed = true;
			}
		}
	});

	Object.keys(scenarios).forEach(function(name) {
		if (!validNames[name]) {
			delete scenarios[name];
			changed = true;
		}
	});

	if (!changed) {
		if (callback) callback();
		return;
	}

	savePublishSettings(callback, function(error) {
		console.warn('Failed to sync occupancy publish settings:', error);
		if (callback) callback();
	});
}

function loadOccupancySamples() {
	$.ajax({
		type: "GET",
		url: 'status',
		dataType: 'json',
		cache: false,
		success: function(data) {
			const nextSamples = {};
			(((data.occupancy || {}).areas) || []).forEach(function(sample) {
				nextSamples[sample.scenario] = sample;
			});
			occupancyScenarios.forEach(function(scenario) {
				const sample = nextSamples[scenario.name];
				const signature = sample ? JSON.stringify(sample) : '';
				if (occupancySampleSignatures[scenario.name] !== signature) {
					occupancySampleSignatures[scenario.name] = signature;
					if (sample) occupancySamples[scenario.name] = sample;
					else delete occupancySamples[scenario.name];
					updateOccupancyStatus(scenario.id);
				}
			});
		},
		error: function(xhr, status, error) {
			console.warn('Failed to load occupancy status:', error);
		}
	});
}

function isOccupancyScenario(scenario) {
	return scenario && scenario.type && scenario.type.toLowerCase() === OCCUPANCY_TYPE.toLowerCase();
}

function ensureOccupancyEventIntervals() {
	if (!window.aoaFullConfig || !window.aoaFullConfig.scenarios) return false;

	let changed = false;
	window.aoaFullConfig.scenarios.forEach(function(scenario) {
		if (!isOccupancyScenario(scenario)) return;

		if (!scenario.eventInterval) {
			scenario.eventInterval = { enabled: true };
			changed = true;
		} else if (scenario.eventInterval.enabled !== true) {
			scenario.eventInterval.enabled = true;
			changed = true;
		}
	});

	return changed;
}

function loadOccupancyScenarios() {
	$.ajax({
		type: "POST",
		url: "/local/objectanalytics/control.cgi",
		contentType: 'application/json',
		data: JSON.stringify({
			apiVersion: "1.6",
			context: "aib100",
			method: "getConfiguration"
		}),
		success: function(response) {
			if (response && response.data && response.data.scenarios) {
				window.aoaFullConfig = response.data;
				occupancyScenarios = response.data.scenarios.filter(isOccupancyScenario);
				const updatedEventIntervals = ensureOccupancyEventIntervals();
				const updatedClassifications = ensureAllObjectClassifications(isOccupancyScenario);
				if (updatedEventIntervals || updatedClassifications) {
					saveFullConfiguration(function() {
						showToast('AOA Occupancy settings updated', 'success');
						loadOccupancyScenarios();
					}, 'Failed to update AOA Occupancy settings');
					return;
				}
				loadPublishSettings(function() {
					syncOccupancyPublishConfiguration(function() {
						renderAllOccupancy();
						loadOccupancySamples();
					});
				});
			}
		},
		error: function(xhr, status, error) {
			showToast('Failed to load AOA occupancy scenarios: ' + error, 'danger');
		}
	});
}

function renderAllOccupancy() {
	const container = $('#occupancy-container');
	container.empty();

	if (occupancyScenarios.length === 0) {
		container.html('<div class="col-12"><p class="text-muted">No occupancy areas configured. Click "Add Occupancy" to create one.</p></div>');
		return;
	}

	occupancyScenarios.forEach(scenario => {
		container.append(createOccupancyCard(scenario));
	});

	setTimeout(() => {
		occupancyScenarios.forEach(scenario => {
			initVideoPlayer(scenario.id);
			startDrawingLoop(scenario.id);
		});
	}, 100);
}

function getArea(scenario) {
	if (!scenario || !scenario.triggers || !scenario.triggers[0]) return null;
	return scenario.triggers[0];
}

function createOccupancyCard(scenario) {
	const publish = getOccupancyPublishSettings(scenario.name || 'Occupancy ' + scenario.id);
	return $(`
		<div class="col-12 col-lg-6 mb-3" id="occupancy-card-${scenario.id}">
			<div class="card">
				<div class="card-header">
					<div class="d-flex justify-content-between align-items-center mb-2">
						<h5 class="card-title mb-0">${scenario.name || 'Occupancy ' + scenario.id}</h5>
						<div>
							<button class="btn btn-sm btn-danger btn-delete-occupancy" data-id="${scenario.id}">Delete</button>
						</div>
					</div>
					<div class="input-group input-group-sm">
						<span class="input-group-text">Name</span>
						<input type="text" class="form-control occupancy-name" value="${scenario.name || ''}" data-id="${scenario.id}" placeholder="Enter occupancy name...">
					</div>
				</div>
				<div class="card-body">
					<div class="video-container" style="position: relative; width: ${VIDEO_WIDTH}px; height: ${VIDEO_HEIGHT}px; background: #000; margin: 0 auto;">
						<div class="video-player" id="video-${scenario.id}" style="width: 100%; height: 100%;"></div>
						<canvas id="canvas-${scenario.id}" width="${VIDEO_WIDTH}" height="${VIDEO_HEIGHT}"
							style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: all; z-index: 10; cursor: crosshair;"></canvas>
					</div>

					<div class="occupancy-status mt-3" id="status-${scenario.id}">
						<div class="text-center text-muted">Waiting for occupancy data...</div>
					</div>

					<div class="publish-settings mt-3" id="publish-settings-${scenario.id}">
						<hr>
						<h6>Publish Settings</h6>
						<div class="form-group mb-2">
							<label for="occupancy-value-${scenario.id}" class="form-label">Value Type</label>
							<select class="form-select form-select-sm" id="occupancy-value-${scenario.id}">
								<option value="min" ${publish.value === 'min' ? 'selected' : ''}>Min</option>
								<option value="max" ${publish.value === 'max' ? 'selected' : ''}>Max</option>
								<option value="average" ${publish.value === 'average' ? 'selected' : ''}>Average</option>
							</select>
						</div>
						<div id="publish-classes-${scenario.id}">${classCheckboxes('occupancy-' + scenario.id, publish.classes)}</div>
					</div>

					<div class="area-config mt-3" id="config-${scenario.id}">
						<hr>
						<button type="button" class="btn btn-sm btn-outline-primary btn-edit-area" data-id="${scenario.id}">Edit Area</button>
					</div>

					<button class="btn btn-success w-100 mt-3 btn-save-area" data-id="${scenario.id}">Save</button>
				</div>
			</div>
		</div>
	`);
}

function updateOccupancyStatus(scenarioId) {
	const scenario = occupancyScenarios.find(s => s.id === scenarioId);
	if (!scenario) return;
	const sample = occupancySamples[scenario.name];
	const container = $('#status-' + scenarioId);
	if (!sample || !sample.hasSample) {
		container.html('<div class="text-muted">Waiting for occupancy data...</div>');
		return;
	}
	const valueType = sample.valueType || 'average';
	let rows = '';
	(sample.labels || []).forEach(function(label) {
		const value = label.value || 0;
		rows += `<div class="col-6">${occupancyLabelIcon(label.key)} ${label.label}: <strong>${Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 })}</strong></div>`;
	});
	const updated = formatOccupancyUpdateTime(sample);
	container.html(`
		<div class="text-center mb-2">
			<h6 class="mb-0">${formatOccupancyValueType(valueType)} Value</h6>
			<small class="text-muted">Updated: ${updated}</small>
		</div>
		${rows ? `
		<div class="row small">${rows}</div>` : '<div class="text-center text-muted">No labels selected for publishing.</div>'}
	`);
}

function occupancyLabelIcon(key) {
	if (key === 'human') return '👤';
	if (key === 'car') return '🚗';
	if (key === 'bike') return '🚲';
	if (key === 'bus') return '🚌';
	if (key === 'truck') return '🚚';
	return '🚙';
}

function formatOccupancyUpdateTime(sample) {
	const value = sample.timestamp || null;
	if (!value) return 'N/A';
	const date = new Date(value);
	if (Number.isNaN(date.getTime())) return value;
	return date.toLocaleTimeString();
}

function initVideoPlayer(scenarioId) {
	const secureConnection = location.protocol === 'https:' ? ' secure=true' : '';
	const player = '<media-stream-player hostname="' + window.location.hostname + '"' + secureConnection +
	               ' format="RTP_H264" compression="40" audio="0"' +
	               ' resolution="' + VIDEO_WIDTH + 'x' + VIDEO_HEIGHT + '"' +
	               ' variant="basic" autoplay></media-stream-player>';
	$('#video-' + scenarioId).html(player);
}

function startDrawingLoop(scenarioId) {
	setInterval(() => drawCanvas(scenarioId), 100);
}

function aoaToCanvas(aoaX, aoaY) {
	const x = (aoaX + 1) / 2 * VIDEO_WIDTH;
	const y = (-aoaY + 1) / 2 * VIDEO_HEIGHT;
	return {x, y};
}

function drawCanvas(scenarioId) {
	const canvas = document.getElementById('canvas-' + scenarioId);
	if (!canvas) return;

	const ctx = canvas.getContext('2d');
	ctx.clearRect(0, 0, VIDEO_WIDTH, VIDEO_HEIGHT);

	const scenario = occupancyScenarios.find(s => s.id === scenarioId);
	const area = getArea(scenario);
	if (!scenario || !area) return;

	const vertices = area.vertices || [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]];
	const points = vertices.map(v => aoaToCanvas(v[0], v[1]));

	ctx.fillStyle = 'rgba(0, 170, 255, 0.22)';
	ctx.strokeStyle = '#00aaff';
	ctx.lineWidth = 3;
	ctx.beginPath();
	points.forEach((point, index) => {
		if (index === 0) ctx.moveTo(point.x, point.y);
		else ctx.lineTo(point.x, point.y);
	});
	ctx.closePath();
	ctx.fill();
	ctx.stroke();

	ctx.fillStyle = '#00aaff';
	points.forEach(point => {
		ctx.beginPath();
		ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
		ctx.fill();
	});

	const labelPoint = points[0] || {x: 20, y: 20};
	ctx.fillStyle = '#ffffff';
	ctx.strokeStyle = '#000000';
	ctx.lineWidth = 3;
	ctx.font = 'bold 14px Arial';
	const label = scenario.name || 'Occupancy ' + scenarioId;
	ctx.strokeText(label, labelPoint.x + 15, labelPoint.y + 20);
	ctx.fillText(label, labelPoint.x + 15, labelPoint.y + 20);
}

$(document).on('click', '.btn-save-area', function() {
	const id = $(this).data('id');
	saveAreaConfiguration(id);
});

$(document).on('click', '.btn-delete-occupancy', function() {
	const id = $(this).data('id');
	deleteOccupancy(id);
});

$(document).on('mousedown', 'canvas[id^="canvas-"]', function(e) {
	const scenarioId = parseInt($(this).attr('id').replace('canvas-', ''));
	const scenario = occupancyScenarios.find(s => s.id === scenarioId);
	const area = getArea(scenario);
	if (!area || !area.vertices) return;

	const rect = this.getBoundingClientRect();
	const canvasX = (e.clientX - rect.left) / rect.width;
	const canvasY = (e.clientY - rect.top) / rect.height;
	const aoaX = canvasX * 2 - 1;
	const aoaY = -(canvasY * 2 - 1);

	let nearestIndex = -1;
	let minDist = 0.1;
	area.vertices.forEach((v, i) => {
		const dist = Math.sqrt((aoaX - v[0]) ** 2 + (aoaY - v[1]) ** 2);
		if (dist < minDist) {
			minDist = dist;
			nearestIndex = i;
		}
	});

	if (nearestIndex >= 0) {
		startDragging(scenarioId, nearestIndex, this);
	}
});

let draggingScenario = null;
let draggingVertex = null;
let draggingCanvas = null;

function startDragging(scenarioId, vertexIndex, canvas) {
	draggingScenario = scenarioId;
	draggingVertex = vertexIndex;
	draggingCanvas = canvas;

	$(document).on('mousemove.drag', onDragMove);
	$(document).on('mouseup.drag', onDragEnd);
}

function onDragMove(e) {
	if (draggingScenario === null) return;

	const scenario = occupancyScenarios.find(s => s.id === draggingScenario);
	const area = getArea(scenario);
	if (!area || !area.vertices) return;

	const rect = draggingCanvas.getBoundingClientRect();
	const canvasX = (e.clientX - rect.left) / rect.width;
	const canvasY = (e.clientY - rect.top) / rect.height;
	const aoaX = Math.max(-1, Math.min(1, canvasX * 2 - 1));
	const aoaY = Math.max(-1, Math.min(1, -(canvasY * 2 - 1)));

	area.vertices[draggingVertex] = [aoaX, aoaY];
}

function onDragEnd() {
	draggingScenario = null;
	draggingVertex = null;
	draggingCanvas = null;
	$(document).off('.drag');
	showToast('Area adjusted. Click Save to apply changes.', 'info');
}

function saveAreaConfiguration(scenarioId) {
	const scenario = occupancyScenarios.find(s => s.id === scenarioId);
	const area = getArea(scenario);
	if (!scenario || !area || !window.aoaFullConfig) return;
	const oldName = scenario.name;
	const newName = $('.occupancy-name[data-id="' + scenarioId + '"]').val().trim();
	if (!newName) {
		showToast('Please enter a name for the occupancy area', 'warning');
		return;
	}
	scenario.name = newName;

	const idx = window.aoaFullConfig.scenarios.findIndex(s => s.id === scenarioId);
	if (idx >= 0) {
		window.aoaFullConfig.scenarios[idx].name = newName;
		window.aoaFullConfig.scenarios[idx].triggers[0].vertices = area.vertices;
	}
	ensureOccupancyEventIntervals();

	const config = occupancyTransmissionConfig();
	const occupancy = config.occupancy;
	const scenarios = config.scenarios;
	if (oldName && oldName !== newName && occupancy.scenarios[oldName]) {
		delete scenarios[oldName];
	}
	scenarios[newName] = scenarios[newName] || {};
	scenarios[newName].value = $('#occupancy-value-' + scenarioId).val();
	scenarios[newName].classes = readClassSelection('#publish-classes-' + scenarioId);

	saveFullConfiguration(function() {
		savePublishSettings(function() {
			showToast('Occupancy area saved', 'success');
			setTimeout(loadOccupancyScenarios, 500);
		}, function(error) {
			showToast('Area saved, but publish settings failed: ' + error, 'warning');
			setTimeout(loadOccupancyScenarios, 500);
		});
	}, 'Failed to save occupancy area');
}

function deleteOccupancy(scenarioId) {
	if (!confirm('Delete this occupancy area? This will remove it from Axis Object Analytics.')) return;
	if (!window.aoaFullConfig) {
		showToast('Configuration not loaded', 'danger');
		return;
	}
	const scenario = occupancyScenarios.find(s => s.id === scenarioId);
	const scenarioName = scenario ? scenario.name : null;

	window.aoaFullConfig.scenarios = window.aoaFullConfig.scenarios.filter(s => s.id !== scenarioId);
	ensureOccupancyEventIntervals();

	saveFullConfiguration(function() {
		if (scenarioName) {
			const config = occupancyTransmissionConfig();
			if (config.scenarios[scenarioName]) {
				delete config.scenarios[scenarioName];
				savePublishSettings(null, function(error) {
					console.warn('Failed to remove deleted occupancy publish settings:', error);
				});
			}
		}
		showToast('Occupancy area deleted', 'success');
		occupancyScenarios = occupancyScenarios.filter(s => s.id !== scenarioId);
		$('#occupancy-card-' + scenarioId).remove();
		if (occupancyScenarios.length === 0) renderAllOccupancy();
	}, 'Failed to delete occupancy area');
}

function addNewOccupancy() {
	if (!window.aoaFullConfig) {
		showToast('Configuration not loaded', 'danger');
		return;
	}

	showToast('Creating new occupancy area...', 'info');

	const maxId = window.aoaFullConfig.scenarios.reduce((max, s) => Math.max(max, s.id || 0), 0);
	const newId = maxId + 1;

	function generateUUID() {
		const hex = () => Math.floor(Math.random() * 16).toString(16);
		const segment = (len) => Array.from({length: len}, hex).join('');
		return `${segment(8)}-${segment(4)}-${segment(4)}-${segment(4)}-${segment(11)}00`;
	}

	const newScenario = {
		id: newId,
		name: "Occupancy " + newId,
		type: OCCUPANCY_TYPE,
		uuid: generateUUID(),
		devices: [{id: 1}],
		filters: [],
		metadataOverlay: null,
		objectClassifications: cloneAllObjectClassifications(),
		triggers: [{
			type: "includeArea",
			vertices: [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]
		}],
		eventInterval: {
			enabled: true
		},
		thresholdConfiguration: {
			enabled: false,
			triggerDelay: 0,
			thresholds: [{
				level: 1,
				type: "moreThan"
			}]
		}
	};

	window.aoaFullConfig.scenarios.push(newScenario);
	ensureOccupancyEventIntervals();

	saveFullConfiguration(function() {
		showToast('Occupancy area created!', 'success');
		loadOccupancyScenarios();
	}, 'Failed to create occupancy area');
}

function saveFullConfiguration(onSuccess, failurePrefix) {
	ensureOccupancyEventIntervals();
	ensureAllObjectClassifications(isOccupancyScenario);
	$.ajax({
		type: "POST",
		url: "/local/objectanalytics/control.cgi",
		contentType: 'application/json',
		data: JSON.stringify({
			apiVersion: "1.6",
			context: "aib100",
			method: "setConfiguration",
			params: window.aoaFullConfig
		}),
		success: function(response) {
			if (response && response.error) {
				const message = response.error.message || 'AOA rejected the configuration';
				console.error(failurePrefix + ':', response.error);
				showToast(failurePrefix + ': ' + message + ' (' + response.error.code + ')', 'danger');
				return;
			}
			onSuccess(response);
		},
		error: function(xhr, status, error) {
			console.error(failurePrefix + ':', xhr.responseText);
			showToast(failurePrefix + ': ' + error, 'danger');
		}
	});
}
</script>
